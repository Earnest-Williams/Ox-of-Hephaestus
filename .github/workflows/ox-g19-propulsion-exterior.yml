name: Ox G19 fitted aft nozzle EVA inspection

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_propulsion_exterior.py"
      - "game/world/ship_propulsion_proof.py"
      - "game/world/ship_rcs_proof.py"
      - "game/world/ship_crew_access.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_propulsion_exterior.py"
      - "game/world/tests/test_ship_propulsion_proof.py"
      - "game/world/tests/test_ship_rcs_proof.py"
      - "game/world/tests/test_installed_ship_propulsion_exterior.py"
      - "game/world/tests/test_installed_ship_propulsion_proof.py"
      - "game/world/tests/test_installed_ship_rcs_proof.py"
      - ".github/workflows/ox-g19-propulsion-exterior.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile plume controls and suited traversal
        run: python -m compileall -q game/world/ship_propulsion_exterior.py game/world/ship_propulsion_proof.py game/world/ship_rcs_proof.py game/world/tests/test_ship_propulsion_proof.py game/world/tests/test_ship_rcs_proof.py game/world/ship_crew_access.py game/world/continuous_ship_physics.py game/world/tests/test_ship_propulsion_exterior.py game/world/tests/test_installed_ship_propulsion_exterior.py game/world/tests/test_installed_ship_propulsion_proof.py game/world/tests/test_installed_ship_rcs_proof.py
      - name: Original plume, radiator and EVA source safety contracts
        working-directory: game
        run: python -m unittest world.tests.test_ship_propulsion_proof world.tests.test_ship_rcs_proof world.tests.test_ship_propulsion_exterior world.tests.test_ship_exterior_radiators world.tests.test_ship_eva_operations -v

