# Opt-in, limited to experiment branch source changes. No ordinary PR inference.
name: Ox Qwen3.5 0.8B local CPU experiment
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen3.5-0.8b-ci]
    paths:
      - ".github/workflows/ox-qwen-local-cpu.yml"
      - "scenarios/qwen_local_smoke.py"
      - "services/ai-handler/tests/test_qwen_local_smoke.py"
      - "services/ai-handler/tests/test_concordia_memory_ab.py"
      - "scenarios/g11_memory_ab_trial.py"
permissions:
  contents: read
concurrency:
  group: ox-qwen-local-cpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qwen-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_PATH: .ox-model-cache/Qwen3.5-0.8B-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install pinned native Concordia and local chat client
        run: python -m pip install -e './services/ai-handler[concordia]' 'openai>=1,<3'
      - name: Offline adapter and proposal regressions
        run: |
          python -m unittest discover -s services/ai-handler/tests -p test_compatible_chat.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_qwen_local_smoke.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_concordia_memory_ab.py -v
      - name: Check counterfactual fixtures offline
        run: python -m unittest discover -s services/ai-handler/tests -p test_counterfactual_decision_trial.py -v
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: .ox-model-cache/Qwen3.5-0.8B-Q4_K_M.gguf
          key: ox-qwen3-5-0-8b-q4km-probe-v1
      - name: Download model weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")" .ox-state/qwen
          if [ ! -s "$MODEL_PATH" ]; then
            curl --fail --location --retry 3 --retry-delay 3 \
              --output "$MODEL_PATH" \
              'https://huggingface.co/notschmee/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf'
          fi
          test "$(stat -c '%s' "$MODEL_PATH")" -gt 400000000
          echo "be5b3cb8c2f3ebd791349c9c775ea38950f23a2b9e792ca2f0411597dd172988  $MODEL_PATH" | sha256sum -c -
          sha256sum "$MODEL_PATH" | tee .ox-state/qwen/model-sha256.txt
      - name: Install pinned CPU-only llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ox-state/qwen/llama
          curl --fail --location --retry 3 \
            --output .ox-state/qwen/llama.tar.gz \
            'https://github.com/ggml-org/llama.cpp/releases/download/b11819/llama-b11819-bin-ubuntu-x64.tar.gz'
          echo '98800bd7b1b7bd5f17ff32c0ee6ce2ea6dbcfe77eb58ff9fd96bdad967a4f286  .ox-state/qwen/llama.tar.gz' | sha256sum -c -
          tar -xzf .ox-state/qwen/llama.tar.gz -C .ox-state/qwen/llama
          test -n "$(find .ox-state/qwen/llama -type f -name llama-server -print -quit)"
      - name: Start localhost inference and await readiness
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find .ox-state/qwen/llama -type f -name llama-server -print -quit)"
          LIBDIR="$(dirname "$SERVER")"
          export LD_LIBRARY_PATH="$LIBDIR:${LD_LIBRARY_PATH:-}"
          "$SERVER" --model "$MODEL_PATH" --alias qwen3.5-0.8b \
            --host 127.0.0.1 --port 8080 --ctx-size 4096 \
            --threads 4 --parallel 1 --n-gpu-layers 0 --reasoning off \
            > .ox-state/qwen/llama-server.log 2>&1 &
          echo $! > .ox-state/qwen/server.pid
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            if ! kill -0 "$(cat .ox-state/qwen/server.pid)" 2>/dev/null; then
              echo "::error::llama-server exited unexpectedly"
              tail -n 90 .ox-state/qwen/llama-server.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::llama-server startup timeout"
          tail -n 90 .ox-state/qwen/llama-server.log
          exit 1
      - name: Native Concordia single-choice inference
        run: python scenarios/qwen_local_smoke.py --output .ox-state/qwen/probe.json
      - name: Matched-evidence Qwen memory A/B (24 real CPU model calls)
        run: |
          python scenarios/g11_memory_ab_trial.py --provider qwen-local \
            --repetitions 3 --output .ox-state/qwen/memory-ab-results.json
      - name: Qwen 0.8B 48 changed-evidence choices
        run: |
          python -m scenarios.counterfactual_decision_trial \
            --provider qwen-local --model qwen3.5-0.8b \
            --api-base http://127.0.0.1:8080/v1 --max-pairs 24 \
            --output .ox-state/qwen/counterfactual-results.json
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-qwen3-5-0-8b-cpu-probe
          path: |
            .ox-state/qwen/probe.json
            .ox-state/qwen/memory-ab-results.json
            .ox-state/qwen/counterfactual-results.json
            .ox-state/qwen/model-sha256.txt
            .ox-state/qwen/llama-server.log
          if-no-files-found: ignore
          retention-days: 7
