name: Ox G19 sixteen industrial service rooms and casualties
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_industrial_access.py"
      - "game/world/ship_industrial_runtime.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_industrial_access.py"
      - "game/world/tests/test_installed_ship_industrial.py"
      - ".github/workflows/ox-g19-industrial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all industrial service, world physics and installed tests
        run: |
          python -m compileall -q game/world/ship_industrial_access.py game/world/ship_industrial_runtime.py game/world/continuous_ship_physics.py game/world/ship_crew_access.py game/world/tests/test_ship_industrial_access.py game/world/tests/test_installed_ship_industrial.py
      - name: Pure gas conservation and industrial leak/patch regression
        working-directory: game
        run: python -m unittest world.tests.test_ship_industrial_access world.tests.test_ship_generator_bay_service world.tests.test_ship_propulsion_bay_service -v
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision canonical installed ship
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Real rated FTL and bearing service operations and finite repair
        working-directory: game
        run: python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_industrial --verbosity=2
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision existing generator and propulsion regression ship
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Generator and propulsion original rated access compatibility
        working-directory: game
        run: python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_generator_bays world.tests.test_installed_ship_propulsion_bay --verbosity=2
