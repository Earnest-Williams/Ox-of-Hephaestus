name: Ox G19 F1 F2 measured-energy flywheel maintenance
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_flywheel_maintenance.py"
      - "game/world/ship_crew_access.py"
      - "game/world/ship_waste_repair_world.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_flywheel_maintenance.py"
      - "game/world/tests/test_installed_ship_flywheel_maintenance.py"
      - ".github/workflows/ox-g19-flywheel-maintenance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile installed mechanical integration
        run: python -m compileall -q game/world/ship_crew_access.py game/world/ship_flywheel_maintenance.py game/world/ship_waste_repair_world.py game/world/continuous_ship_physics.py game/world/tests/test_ship_flywheel_maintenance.py game/world/tests/test_installed_ship_flywheel_maintenance.py
      - name: Pure module, flywheel energy and shared spare-mass invariants
        working-directory: game
        run: python -m unittest world.tests.test_ship_flywheel_maintenance world.tests.test_ship_equipment_repair world.tests.test_ship_electrical_power world.tests.test_ship_hazardous_access -v
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install actual Evennia
        run: python -m pip install .
      - name: Provision disposable ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Real suits, finite spares, lockout fault, four local repair scenarios
        working-directory: game
        run: python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_flywheel_maintenance --verbosity=2
