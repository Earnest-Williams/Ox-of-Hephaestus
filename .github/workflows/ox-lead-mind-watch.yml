name: Ox G19 first account watch on delivered hatch evidence
on:
  push:
    branches: [main, g19/lead-mind-first-watch-trigger]
    paths:
      - ".github/workflows/ox-lead-mind-watch.yml"
      - "game/world/ship_mind_watch.py"
      - "game/world/ship_mind_watch_world.py"
      - "game/commands/ship_mind_watch.py"
      - "game/world/apps.py"
      - "game/commands/account_cmdsets.py"
      - "game/world/tests/test_ship_mind_watch.py"
      - "game/world/tests/test_installed_ship_mind_watch.py"
      - "game/world/tests/test_account_command_boundary.py"
      - "game/world/tests/test_character_command_boundary.py"
      - "game/world/tests/test_installed_ship_network_access.py"
      - "game/world/ship_network_access.py"
      - "game/world/ship_network_access_world.py"
      - "game/world/ship_access_contact.py"
      - "game/world/ship_access_contact_world.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/full_ship_operations.py"
      - "design/ship/ox_full_ship.json"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/ox-lead-mind-watch.yml"
      - "game/world/ship_mind_watch.py"
      - "game/world/ship_mind_watch_world.py"
      - "game/commands/ship_mind_watch.py"
      - "game/world/apps.py"
      - "game/commands/account_cmdsets.py"
      - "game/world/tests/test_ship_mind_watch.py"
      - "game/world/tests/test_installed_ship_mind_watch.py"
      - "game/world/tests/test_account_command_boundary.py"
      - "game/world/tests/test_character_command_boundary.py"
      - "game/world/tests/test_installed_ship_network_access.py"
      - "game/world/ship_network_access.py"
      - "game/world/ship_network_access_world.py"
      - "game/world/ship_access_contact.py"
      - "game/world/ship_access_contact_world.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/full_ship_operations.py"
      - "design/ship/ox_full_ship.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ox-lead-mind-watch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile watch and check CI ownership
        run: |
          python -m compileall -q game/world/ship_mind_watch.py game/world/ship_mind_watch_world.py game/commands/ship_mind_watch.py game/world/tests/test_ship_mind_watch.py game/world/tests/test_installed_ship_mind_watch.py
          python .github/ci/check_ox_ci_scope.py
          python design/ci/check_world_test_selection.py
      - name: Test bounded event-time watch trust policy
        working-directory: game
        run: python -m unittest world.tests.test_ship_mind_watch -v
  installed:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: pure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENNIA_SUPERUSER_USERNAME: OxCI
      EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
      OX_PG_DATABASE: ox_ship_mind_watch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Evennia and PostgreSQL
        run: python -m pip install .
      - name: Test watch receipts, dark network, no retroactive triggers
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_mind_watch world.tests.test_account_command_boundary world.tests.test_character_command_boundary --verbosity=2
