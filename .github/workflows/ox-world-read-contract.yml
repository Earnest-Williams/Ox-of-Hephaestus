name: Ox P2 world read contract

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/ox-world-read-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared package, formatter and type checker
        run: python -m pip install -e ./contracts "black>=25,<27" "mypy>=1.18,<2"
      - name: Pure contract regression tests
        run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v
      - name: Black 88 and strict mypy (report both diagnostics)
        shell: bash
        run: |
          set +e
          black -l 88 --check --diff contracts/ox_contracts/world_read_model.py contracts/tests/test_world_read_model.py
          black_result=$?
          mypy --strict contracts/ox_contracts/world_read_model.py
          mypy_result=$?
          if [ "$black_result" -ne 0 ] || [ "$mypy_result" -ne 0 ]; then
            exit 1
          fi
