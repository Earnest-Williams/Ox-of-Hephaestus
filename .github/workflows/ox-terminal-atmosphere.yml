# Explicit fatal six-run behavioral experiment; isolated synthetic ship.
# No ordinary push launches hosted-model spending.
name: Ox terminal atmosphere six-run experiment

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "scenarios/terminal_loss/trial.py"
      - ".github/workflows/ox-terminal-atmosphere.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-terminal-atmosphere-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terminal:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: "${{ matrix.provider }} seed ${{ matrix.seed }}"
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        provider: [goap, gemini]
        seed: [241, 577, 911]
    env:
      OX_COGNITION_PROVIDER: ${{ matrix.provider == 'gemini' && 'gemini' || 'mock' }}
      OX_LLM_MODEL: gemini-3.1-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install pinned Concordia and GOAP
        run: python -m pip install -e './services/ai-handler[concordia]'
      - name: Validate live-model key without printing it
        if: ${{ matrix.provider == 'gemini' }}
        env:
          MODEL_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$MODEL_KEY" ]; then
            echo "::error::Gemini run requires a repository GEMINI_API_KEY secret."
            exit 1
          fi
          echo "GEMINI_API_KEY=$MODEL_KEY" >> "$GITHUB_ENV"
      - name: Exercise fatal physical invariants and idempotence
        run: python scenarios/terminal_loss/trial.py --self-test
      - name: Run isolated experiment
        env:
          OX_SEED: ${{ matrix.seed }}
          OX_PROVIDER: ${{ matrix.provider }}
        run: |
          python scenarios/terminal_loss/trial.py --seed "$OX_SEED" --provider "$OX_PROVIDER" --output ".ox-state/terminal"
      - name: Publish a per-crew behavioral trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.provider }}-${{ matrix.seed }}
          path: |
            .ox-state/terminal/scenario.md
            .ox-state/terminal/scenario.json
          if-no-files-found: warn
          retention-days: 14
