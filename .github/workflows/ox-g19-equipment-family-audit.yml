name: Ox G19 all 808 equipment-family closure inventory

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_equipment_family_audit.py"
      - "game/world/tests/test_ship_equipment_family_audit.py"
      - "game/world/tests/test_installed_ship_equipment_family_audit.py"
      - "game/world/ship_cabin_fancoils.py"
      - ".github/workflows/ox-g19-equipment-family-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and cross-check as-fitted family/type evidence
        run: |
          python -m compileall -q game/world/ship_equipment_family_audit.py game/world/ship_cabin_fancoils.py game/world/tests/test_ship_equipment_family_audit.py game/world/tests/test_installed_ship_equipment_family_audit.py
      - name: All 91 original kinds, true source IDs and explicit outstanding machinery
        working-directory: game
        run: python -m unittest world.tests.test_ship_equipment_family_audit -v

