name: Ox G19 attended casualty carriage
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_casualty_transport.py"
      - "game/world/ship_crew_access.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_casualty_transport.py"
      - "game/world/tests/test_installed_ship_casualty_transport.py"
      - ".github/workflows/ox-g19-rescue.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ox-g19-rescue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile rescue, living crew and movement integration
        run: python -m compileall -q game/world/ship_casualty_transport.py game/world/ship_crew_access.py game/world/continuous_ship_physics.py game/world/tests/test_ship_casualty_transport.py game/world/tests/test_installed_ship_casualty_transport.py
      - name: Finite transport, ecology and physiology checks
        working-directory: game
        run: python -m unittest world.tests.test_ship_casualty_transport world.tests.test_ship_crew_medical world.tests.test_ship_crew_physiology -v
