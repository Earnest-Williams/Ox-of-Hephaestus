name: Ox G19 EVA, rotating HAB and major damage

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_hab_sync.py"
      - "game/world/ship_eva_operations.py"
      - "game/world/ship_major_damage.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_hab_sync.py"
      - "game/world/tests/test_ship_eva_operations.py"
      - "game/world/tests/test_ship_major_damage.py"
      - "game/world/tests/test_installed_ship_eva_major.py"
      - ".github/workflows/ox-g19-eva-major.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_eva_operations.py"
      - "game/world/ship_major_damage.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_crew_access.py"
      - ".github/workflows/ox-g19-eva-major.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ox-g19-eva-major-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ship EVA/HAB and entire integration layer
        run: |
          python -m compileall -q game/world/ship_eva_operations.py game/world/ship_hab_sync.py game/world/continuous_ship_physics.py game/world/ship_crew_access.py
      - name: Pure finite suit, transfer and moving-frame proofs
        working-directory: game
        run: python -m unittest world.tests.test_ship_hab_sync world.tests.test_ship_eva_operations world.tests.test_ship_major_damage -v

  installed:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Installed airlocks, suit stock and major breach recovery
        working-directory: game
        run: python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_eva_major --verbosity=2
