name: Ox G19 fitted forty cabin fan-coils

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_cabin_fancoils.py"
      - "game/world/tests/test_ship_cabin_fancoils.py"
      - "game/world/tests/test_installed_ship_cabin_fancoils.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-cabin-fancoils.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile original individual coil/physics files
        run: |
          python -m compileall -q game/world/ship_cabin_fancoils.py game/world/continuous_ship_physics.py game/world/tests/test_ship_cabin_fancoils.py game/world/tests/test_installed_ship_cabin_fancoils.py
      - name: Pure forty-cabin source, thermal, relay and replay conservation
        working-directory: game
        run: python -m unittest world.tests.test_ship_cabin_fancoils -v

