name: Ox G19 fitted forty cabin fan-coils

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_cabin_fancoils.py"
      - "game/world/tests/test_ship_cabin_fancoils.py"
      - "game/world/tests/test_installed_ship_cabin_fancoils.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-cabin-fancoils.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile original individual coil/physics files
        run: |
          python -m compileall -q game/world/ship_cabin_fancoils.py game/world/continuous_ship_physics.py game/world/tests/test_ship_cabin_fancoils.py game/world/tests/test_installed_ship_cabin_fancoils.py
      - name: Pure forty-cabin source, thermal, relay and replay conservation
        working-directory: game
        run: python -m unittest world.tests.test_ship_cabin_fancoils -v

  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision independently isolated as-fitted full ship
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Actual forty electrical and LT cabin terminals, crew and output
        working-directory: game
        run: python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_cabin_fancoils --verbosity=2

  adjacent:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision original affected LT motor and habitat equipment
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Existing as-fitted LT motor, feeder fault and process-output regression
        working-directory: game
        run: |
          python -m world.test_runner --prebuilt-ship \
            world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_lt_motor_fuse_controls_real_propulsion_heat_sink_and_room_cooling \
            world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_cabin_refit_panel_is_not_the_fan_coil_source \
            world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_one_hab_air_handler_trip_stops_forced_flow_without_isolating_ducts \
            --verbosity=2
