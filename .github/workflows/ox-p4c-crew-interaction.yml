name: Ox P4c autonomous crew and human hails

on:
  pull_request:
    paths:
      - "game/**"
      - "services/ai-handler/**"
      - ".github/workflows/ox-p4c-crew-interaction.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "services/ai-handler/**"
      - ".github/workflows/ox-p4c-crew-interaction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real game, Concordia and transport
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler[concordia,transport]'
      - name: Set disposable account credentials
        shell: bash
        run: |
          TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          OWNER="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$OWNER"
          echo "OX_PROBE_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_PASSWORD=$OWNER" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_USERNAME=OxTrialOwner" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_EMAIL=owner@example.invalid" >> "$GITHUB_ENV"
      - name: Verify in-world reply privacy and state authority
        working-directory: game
        run: |
          evennia migrate --noinput
          evennia --settings settings.py test world.tests.test_crew_interaction world.tests.test_autonomy --verbosity=2
      - name: Seed fault, scheduled duty and legitimate addressed hail
        working-directory: game
        run: |
          evennia shell --command="from world.transport_probe import provision; provision(); from world.live_crew import fixture_setup; fixture_setup(scheduled_clock=True); from world.bootstrap import build_ship; from world.crew_interaction import send_hail; from evennia.utils.create import create_object; s=build_ship(); guest=create_object('typeclasses.ship.CrewCharacter',key='Visiting Operator',location=s['bridge']); ok,msg=send_hail(guest,'iona','What is the engineering status?'); assert ok,msg; print('OX_P4C_HUMAN_HAIL_SEEDED')"
      - name: Operate exactly one independent crew supervisor
        shell: bash
        run: |
          set -euo pipefail
          (cd game && evennia start)
          python - <<'PY'
          import socket,time
          for _ in range(90):
              try:
                  with socket.create_connection(("127.0.0.1",4002),timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("Evennia portal unavailable")
          PY
          sleep 5
          set +e
          timeout 60s python -m ox_ai.runtime.watch_service serve
          CODE=$?
          set -e
          if [ "$CODE" -ne 124 ]; then
            echo "Supervisor unexpectedly exited with $CODE"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".ox-state/p4b-supervisor.json").read_text())
          assert len(data["completed"])==1, data
          assert data["phase"]=="idle", data
          print("OX_P4C_ONE_PROCESS_AUTONOMOUS_INCIDENT_PASS")
          PY
      - name: Stop server and verify live handover and response
        if: always()
        working-directory: game
        run: evennia stop || true
      - name: Independently check world state and print actionable diagnostics
        working-directory: game
        run: |
          evennia shell --command="from world.bootstrap import build_ship; from world.live_crew import inbox; from evennia.objects.models import ObjectDB; s=build_ship(); p=s['pump']; r=s['roster']; guest=ObjectDB.objects.filter(db_key='Visiting Operator').first(); ops=[e['operation'] for e in p.db.event_history]; guest_kinds=[e['kind'] for e in inbox(guest)] if guest else []; chief_kinds=[e['kind'] for e in inbox(s['chief'])]; ari_kinds=[e['kind'] for e in inbox(s['watch'])]; print('OX_P4C_FINAL_DIAGNOSTIC',repr({'pump':p.state,'closed':p.db.ox_incident_closed,'active':r.db.ox_active_engineer,'expected':s['chief'].dbref,'ops':ops,'guest':guest is not None,'guest_events':guest_kinds,'chief_events':chief_kinds,'ari_events':ari_kinds})); assert guest is not None, 'guest missing'; assert p.state=='normal' and p.db.ox_incident_closed, 'cooling incident not resolved'; assert r.db.ox_active_engineer==s['chief'].dbref, 'handover not completed'; assert ops==['fault','isolate','repair','commission'], 'physical event history differs'; assert guest_kinds.count('crew_reply')==1, 'player reply missing or duplicated'; assert chief_kinds.count('hail_answered')==1, 'crew answer missing or duplicated'; print('OX_P4C_UNATTENDED_HANDOVER_AND_HAIL_PASS')"
