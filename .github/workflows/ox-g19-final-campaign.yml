name: Ox G19 final multi-system casualties and restart
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/**"
      - ".github/workflows/ox-g19-final-campaign.yml"
      - "!**/*.md"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ox-g19-final-campaign-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile full G19 clock and final campaign
        run: |
          python -m compileall -q game/world/continuous_ship_physics.py game/world/ship_unclassified_spaces.py game/world/ship_unclassified_runtime.py game/world/ship_crew_access.py game/world/tests/test_installed_ship_g19_final_campaign.py game/world/ship_gas_refill.py game/world/tests/test_installed_ship_gas_refill.py
      - name: Pure conservation, casualty transport and fault recovery
        working-directory: game
        run: |
          python -m unittest world.tests.test_ship_unclassified_spaces world.tests.test_ship_casualty_transport world.tests.test_ship_fault_recovery world.tests.test_ship_gas_refill world.tests.test_ship_snapshot -v

  independent_process_restart:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OX_G19_RESTART_CI: "1"
      EVENNIA_SUPERUSER_USERNAME: OxCI
      EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Compile independent-process restart harness
        run: python -m compileall -q game/world/g19_process_recovery.py
      - name: Process A - commission disposable actual ship, create casualty and exit
        working-directory: game
        env:
          OX_PG_DATABASE: ox_g19_restart
        run: python -m world.g19_process_recovery prepare
      - name: Process B - fresh interpreter, same durable database, catch up safely
        working-directory: game
        env:
          OX_PG_DATABASE: ox_g19_restart
        run: python -m world.g19_process_recovery resume
      - name: Process C - another cold interpreter verifies durable casualty and replay safety
        working-directory: game
        env:
          OX_PG_DATABASE: ox_g19_restart
        run: python -m world.g19_process_recovery confirm


