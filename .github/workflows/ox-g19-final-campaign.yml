name: Ox G19 final multi-system casualties and restart
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/**"
      - ".github/workflows/ox-g19-final-campaign.yml"
      - "!**/*.md"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ox-g19-final-campaign-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile full G19 clock and final campaign
        run: |
          python -m compileall -q game/world/continuous_ship_physics.py game/world/ship_unclassified_spaces.py game/world/ship_unclassified_runtime.py game/world/ship_crew_access.py game/world/tests/test_installed_ship_g19_final_campaign.py
      - name: Pure conservation, casualty transport and fault recovery
        working-directory: game
        run: |
          python -m unittest world.tests.test_ship_unclassified_spaces world.tests.test_ship_casualty_transport world.tests.test_ship_fault_recovery -v

  installed_campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision full as-fitted Evennia ship
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Four actual multi-system, persistence and atomicity tests
        working-directory: game
        run: |
          python -m world.test_runner world.tests.test_installed_ship_g19_final_campaign --verbosity=2

  adjacent_systems:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision real installed electrical/medical/cargo world
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Adjacent brownout, dark instruments and cargo recovery
        working-directory: game
        run: |
          python -m world.test_runner \
            world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_generator_feeder_failure_browns_out_normal_work \
            world.tests.test_installed_ship_instrumentation.InstalledInstrumentationTests.test_real_panel_power_loss_does_not_clear_stale_fault \
            world.tests.test_installed_ship_unclassified.OriginalCargoAndVoidClosure.test_compound_breach_isolation_and_three_real_crew_casualty_carry \
            --verbosity=2

  independent_process_restart:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OX_G19_RESTART_CI: "1"
      EVENNIA_SUPERUSER_USERNAME: OxCI
      EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Compile independent-process restart harness
        run: python -m compileall -q game/world/g19_process_recovery.py
      - name: Process A - commission disposable actual ship, create casualty and exit
        working-directory: game
        env:
          OX_G19_RESTART_DB_PATH: ${{ runner.temp }}/ox-g19-restart.sqlite3
        run: python -m world.g19_process_recovery prepare
      - name: Process B - fresh interpreter, same durable database, catch up safely
        working-directory: game
        env:
          OX_G19_RESTART_DB_PATH: ${{ runner.temp }}/ox-g19-restart.sqlite3
        run: python -m world.g19_process_recovery resume
      - name: Process C - another cold interpreter verifies durable casualty and replay safety
        working-directory: game
        env:
          OX_G19_RESTART_DB_PATH: ${{ runner.temp }}/ox-g19-restart.sqlite3
        run: python -m world.g19_process_recovery confirm


  cross_system_compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Commission the original ship under the Evennia test database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Original G18 physics plus finite-output cross-system regressions
        working-directory: game
        run: |
          python -m world.test_runner \
            world.tests.test_continuous_ship_physics.PhysicsRuntimeTests.test_fire_thermal_and_finite_water \
            world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_live_eclss_capture_has_current_mass_receipt_not_just_power \
            world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_bearing_lube_own_flow_pressure_and_actual_fuse_loss \
            world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_double_treatment_casualty_halts_recovery_not_creating_water \
            world.tests.test_installed_ship_food.InstalledFoodTests.test_spoilage_debits_live_original_food_inventory \
            world.tests.test_installed_ship_portable_damage.InstalledPortableEmergencyMachines.test_fitted_fan_at_carried_rescue_site_captures_actual_smoke \
            world.tests.test_installed_ship_workshop_fabrication.InstalledMachiningTests.test_live_machining_to_real_part_and_final_installed_repair \
            world.tests.test_installed_ship_propulsion_proof.RealDriveOutputWitness.test_real_propellant_and_inertial_delta_v_prove_drive \
            world.tests.test_installed_ship_medical.InstalledMedical.test_lost_local_feeder_pauses_work_without_refund \
            world.tests.test_installed_ship_movement.InstalledMovementTests.test_docked_berth_prevents_helm_ftl_and_drum_release \
            world.tests.test_installed_ship_eva_major.InstalledEVAMajorDamageTests.test_large_breach_isolation_and_suited_exterior_hull_recovery \
            world.tests.test_installed_ship_cabin_fancoils.InstalledCabinFanCoils.test_live_original_power_and_lt_valves_create_positive_cabin_output \
            --verbosity=2
