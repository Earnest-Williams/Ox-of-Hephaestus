name: Ox G19 rated F1 F2 flywheel worksite access
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_hazardous_access.py"
      - "game/world/ship_crew_access.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_hazardous_access.py"
      - "game/world/tests/test_installed_ship_hazardous_access.py"
      - ".github/workflows/ox-g19-hazardous-access.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ox-g19-hazardous-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile actual bay transfer runtime
        run: python -m compileall -q game/world/ship_hazardous_access.py game/world/ship_crew_access.py game/world/continuous_ship_physics.py game/world/tests/test_ship_hazardous_access.py game/world/tests/test_installed_ship_hazardous_access.py
      - name: Bounded original two-bay sealed-transfer invariants
        working-directory: game
        run: python -m unittest world.tests.test_ship_hazardous_access world.tests.test_ship_eva_operations -v
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Four real F1 F2 original airlock scenarios
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_hazardous_access --verbosity=2
