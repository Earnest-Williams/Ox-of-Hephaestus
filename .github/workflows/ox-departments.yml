name: Ox P4d specialist ship departments

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/**"
      - ".github/workflows/ox-departments.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/ox-departments.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  departments:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/core.txt
      - name: Install real Evennia and compile game code
        run: |
          python -m pip install .
          python -m compileall -q game
          node --check game/web/ox_terminal.js
      - name: Create ephemeral, noninteractive owner credential
        shell: bash
        run: |
          TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$TOKEN"
          echo "EVENNIA_SUPERUSER_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_USERNAME=OxCI" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_EMAIL=oxci@example.invalid" >> "$GITHUB_ENV"
      - name: Test specialist world rules, full-ship topology and old coolant physics
        working-directory: game
        run: |
          evennia migrate --noinput
          python -m world.test_runner world.tests.test_departments world.tests.test_ship world.tests.test_ship_model world.tests.test_ship_world world.tests.test_ship_telemetry world.tests.test_full_ship_operations world.tests.test_ox_terminal world.tests.test_autonomy --verbosity=2
      - name: Validate v0.5 candidate and install the full operational register
        working-directory: game
        run: |
          evennia shell --command="from world.full_ship_operations import load_candidate, install_candidate, summary; from world.ship_world import ensure_canonical_ship; ensure_canonical_ship(); assert len(load_candidate()['equipment']) == 808; r=install_candidate(operator_approved=True); assert r['counts']['isolator']==1256; assert summary()['equipment']==808; print('OX_G17_FULL_REGISTER_INSTALLED')"
          evennia shell --command="from world.full_ship_operations import install_candidate, state; assert not install_candidate(operator_approved=True)['installed']; assert state('inventory', 'INV-FOOD-LONG-LEG').quantity==56.79; print('OX_G17_RESTART_PRESERVES_HOLDINGS')"
      - name: Initialise and verify 133 finite pressure cells across independent processes
        working-directory: game
        run: |
          evennia shell --command="from world.full_ship_operations import install_pressure_cells, initialize_nominal_atmosphere; assert install_pressure_cells(operator_approved=True)['cells']==133; n=initialize_nominal_atmosphere(operator_approved=True); assert n['total_air_kg']>79270; print('OX_G17_133_INITIALIZED')"
          evennia shell --command="from world.full_ship_operations import pressure_reading, vent_pressure_cell; a=pressure_reading('PZ-HAB-03'); assert abs(a['pressure_pa']-101325)<0.1; vent_pressure_cell('PZ-HAB-03', 100, operator=True); assert pressure_reading('PZ-HAB-03')['pressure_pa']<101325; print('OX_G17_FINITE_GAS_CASUALTY_PERSISTS')"
      - name: Materialise all 421 canonical spaces and 517 bidirectional physical links
        working-directory: game
        run: |
          evennia shell --command="from world.ship_world import build_canonical_ship; b=build_canonical_ship(); assert len(b['spaces']) == 421; assert len(b['access']) == 1034; assert b['root'].db.ox_topology_complete; print('OX_CANONICAL_421_SPACES_1034_EXITS_BUILT')"
      - name: Inspect full-ship read-only telemetry and modify one persisted room
        working-directory: game
        run: |
          evennia shell --command="from time import perf_counter; from world.ship_world import ensure_canonical_ship, find_ship_space; from world.ship_telemetry import read_spatial_telemetry; assert ensure_canonical_ship()['skipped']; start=perf_counter(); s=read_spatial_telemetry(); elapsed_ms=round((perf_counter()-start)*1000, 1); assert s['topology_complete'] and s['coverage']['spaces_reporting']==421; assert s['model_version']=='0.4'; r=find_ship_space('CMD-PRIMARY'); assert r.db.ox_current_condition=='serviceable'; r.db.ox_current_condition='under_inspection'; print('OX_CANONICAL_TELEMETRY_READ_MS', elapsed_ms)"
      - name: Verify restart-safe spatial state in another Evennia process
        working-directory: game
        run: |
          evennia shell --command="from world.ship_world import ensure_canonical_ship, find_ship_space; from world.ship_telemetry import read_spatial_telemetry; assert ensure_canonical_ship()['skipped']; s=read_spatial_telemetry(); conditions={r['id']:r['condition'] for r in s['space_states']}; assert conditions['CMD-PRIMARY']=='under_inspection'; find_ship_space('CMD-PRIMARY').db.ox_current_condition='serviceable'; print('OX_CANONICAL_PERSISTED_TELEMETRY_PASS')"
      - name: Seed independent departmental faults in persistent game database
        working-directory: game
        run: |
          evennia shell --command="from world.bootstrap import build_ship; s=build_ship(); assert len({s[x].id for x in ('bridge','passage','engineering','cargo_hold','environmental','mess','workshop')})==7; assert s['cradle'].inject_fault()[0]; assert s['scrubber'].inject_fault()[0]; print('OX_P4D_WORLD_SEEDED')"
      - name: Execute authorized repairs in another process
        working-directory: game
        run: |
          evennia shell --command="from world.bootstrap import build_ship; s=build_ship(); c=s['cradle']; m=s['cargo']; a=s['scrubber']; t=s['environment']; assert c.state=='unsecured' and a.state=='saturated'; c.note_inspection(m); assert c.restow(m)[0]; c.note_inspection(m); assert c.certify(m)[0]; a.note_inspection(t); assert a.isolate(t)[0]; assert a.replace(t)[0]; a.note_inspection(t); assert a.restart(t)[0]; print('OX_P4D_DEPARTMENT_WORK_DONE')"
      - name: Independently inspect persisted physical results and recipient events
        working-directory: game
        run: |
          evennia shell --command="from world.bootstrap import build_ship; from world.live_crew import inbox; s=build_ship(); assert s['cradle'].state=='secured' and s['scrubber'].state=='nominal'; assert s['scrubber'].db.spare_cartridges==1; assert [e['operation'] for e in s['cradle'].db.event_history]==['shift','restow','certify']; assert [e['operation'] for e in s['scrubber'].db.event_history]==['saturate','isolate','replace','restart']; assert [e['kind'] for e in inbox(s['cargo'])]==['cargo_shift']; assert [e['kind'] for e in inbox(s['environment'])]==['atmosphere_alarm']; assert s['pump'].state=='normal'; print('OX_P4D_PERSISTED_WORLD_PASS')"
