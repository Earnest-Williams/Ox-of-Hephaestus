name: Ox G1 PostgreSQL concurrent world effects

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/**"
      - "pyproject.toml"
      - ".github/workflows/ox-g1-postgres-contention.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "pyproject.toml"
      - ".github/workflows/ox-g1-postgres-contention.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  postgres-contention:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      # ADR 0010: the game-managed cluster, using a disposable database.
      OX_PG_CONCURRENCY_TEST: "1"
      OX_PG_DATABASE: ox_contention_ci
      DJANGO_SETTINGS_MODULE: server.conf.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/core.txt
      - name: Install actual game (includes the PostgreSQL driver)
        run: |
          python -m pip install .
          python -m compileall -q game/world game/server/conf
      - name: Game-managed PostgreSQL launcher (ADR 0010)
        working-directory: game
        run: python -m unittest server.conf.oxpg.tests -v
      - name: Apply real Django schema to the disposable game-managed database
        working-directory: game
        run: |
          python -m django migrate --noinput --skip-checks
          python -m django makemigrations world --check --dry-run
      - name: Race independent world commands through distinct database connections
        working-directory: game
        run: python -m world.postgres_contention
