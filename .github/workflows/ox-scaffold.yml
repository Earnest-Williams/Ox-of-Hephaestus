name: Ox service scaffold checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "services/ai-handler/**"
      - "services/interface/**"
      - ".github/workflows/ox-scaffold.yml"
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - "services/ai-handler/**"
      - "services/interface/**"
      - ".github/workflows/ox-scaffold.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract-smoke:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install standalone service skeletons
        run: |
          python -m pip install -e ./services/ai-handler
          python -m pip install -e ./services/interface
      - name: Check sources and provisional contracts
        run: |
          python -m compileall -q services/ai-handler/src services/interface/src
          python -m unittest discover -s services/ai-handler/tests -v
      - name: Run complete model-free three-crew watch scenario
        run: |
          python -m ox_ai.scenarios.watch_handover > /tmp/ox-watch-handover.json
          python -c "import json; d=json.load(open('/tmp/ox-watch-handover.json')); assert d['status']=='passed' and d['inference_calls']==0 and d['current_active_engineer']=='iona' and d['world_submissions']==2; print('OX_WATCH_HANDOVER_PASS')"
      - name: Run complete coordinated coolant incident (no model)
        run: |
          python -m ox_ai.scenarios.coolant_fault > /tmp/ox-coolant.json
          python -c "import json; d=json.load(open('/tmp/ox-coolant.json')); assert d['status']=='passed' and d['pump_state']=='normal' and d['incident_closed'] and d['inference_calls']==0 and d['world_action_requests']==10; print('OX_THREE_CREW_COOLANT_PASS')"


