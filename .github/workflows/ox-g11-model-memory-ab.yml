# Bounded, manual-only hosted model quality pilot. No automatic paid calls.
name: Ox G11 matched-evidence memory A/B
on:
  # One-time, owner-approved G11 run on this isolated experiment branch only.
  push:
    branches: [experiment/g11-ab-20261021]
    paths: [".github/workflows/ox-g11-model-memory-ab.yml"]
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Paired repeats, 1-3 (8-24 hosted requests)"
        type: choice
        required: true
        default: "1"
        options: ["1", "2", "3"]
permissions:
  contents: read
concurrency:
  group: ox-g11-hosted-memory-ab
  cancel-in-progress: false
jobs:
  hosted-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install pinned Concordia
        run: python -m pip install -e './services/ai-handler[concordia]'
      - name: Check evidence parity without hosted calls
        run: python -m unittest discover -s services/ai-handler/tests -p test_concordia_memory_ab.py -v
      - name: Run hosted matched-evidence A/B
        run: |
          python scenarios/g11_memory_ab_trial.py --provider gemini \
            --repetitions "${{ inputs.repetitions || '3' }}" \
            --output .ox-state/g11/memory-ab-results.json
      - name: Preserve bounded aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-g11-memory-ab
          path: .ox-state/g11/memory-ab-results.json
          retention-days: 14
          if-no-files-found: ignore
