# One-off owner-approved G11 discrimination probe on isolated experiment branch.
# Main's manual-only workflow is unchanged.
name: Ox G11 matched-evidence memory A/B
on:
  push:
    branches: [experiment/g11-memory-discriminative-20261021]
    paths: [".github/workflows/ox-g11-model-memory-ab.yml"]
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Paired repeats, 1-3 (8-24 hosted requests)"
        type: choice
        required: true
        default: "1"
        options: ["1", "2", "3"]
permissions:
  contents: read
concurrency:
  group: ox-g11-hosted-memory-ab
  cancel-in-progress: false
jobs:
  hosted-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install pinned Concordia
        run: python -m pip install -e './services/ai-handler[concordia]'
      - name: Check evidence parity without hosted calls
        run: python -m unittest discover -s services/ai-handler/tests -p test_concordia_memory_ab.py -v
      - name: Verify harder paired fixtures without hosted calls
        run: |
          python scenarios/g11_memory_challenge_trial.py --provider capture \\
            --repetitions 1 --output /tmp/g11-challenge-smoke.json
      - name: Run hosted matched-evidence A/B
        run: |
          python scenarios/g11_memory_challenge_trial.py --provider gemini \
            --repetitions 2 \
            --output .ox-state/g11/memory-ab-challenge-results.json
      - name: Preserve bounded aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-g11-memory-challenge
          path: .ox-state/g11/memory-ab-challenge-results.json
          retention-days: 14
          if-no-files-found: ignore
