name: Ox G4e independent knowledge and techniques

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/**"
      - "game/commands/**"
      - ".github/workflows/ox-g4e-knowledge-techniques.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  independent-learning:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install world and handler
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler'
      - name: Compile world and validate migrations
        run: |
          python -m compileall -q game/world game/commands
          cd game
          DJANGO_SETTINGS_MODULE=server.conf.settings python -m django makemigrations world --check --dry-run
      - name: Verify theory/technique independence and world opacity
        working-directory: game
        run: |
          python -m world.test_runner \
            world.tests.test_character_learning \
            world.tests.test_task_resolution \
            world.tests.test_character_profiles \
            world.tests.test_captain_followthrough \
            world.tests.test_capabilities \
            world.tests.test_work_receipts --verbosity=2
