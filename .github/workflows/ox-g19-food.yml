name: Ox G19 finite food, cultivation and galley integration

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_food_cultivation.py"
      - "game/world/ship_food_logistics.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_food_cultivation.py"
      - "game/world/tests/test_ship_food_logistics.py"
      - "game/world/tests/test_installed_ship_food.py"
      - "game/world/tests/test_installed_ship_cultivation.py"
      - "game/commands/ship_physics.py"
      - ".github/workflows/ox-g19-food.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_food_cultivation.py"
      - "game/world/ship_food_logistics.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_food_cultivation.py"
      - "game/world/tests/test_ship_food_logistics.py"
      - "game/world/tests/test_installed_ship_food.py"
      - "game/world/tests/test_installed_ship_cultivation.py"
      - "game/commands/ship_physics.py"
      - ".github/workflows/ox-g19-food.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g19-food-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Pure ledger, nutrient conservation, seeded fuzz and legacy water
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile new and coupled physical ship runtime
        run: |
          python -m compileall -q game/world/ship_food_cultivation.py game/world/ship_food_logistics.py game/world/ship_water_recycling.py game/world/continuous_ship_physics.py game/world/ship_crew_access.py game/commands/ship_physics.py game/world/tests/test_ship_food_logistics.py game/world/tests/test_ship_food_cultivation.py game/world/tests/test_installed_ship_food.py
      - name: Run food chain, original hydroponics, and 730-day water conservation
        working-directory: game
        run: |
          python -m unittest world.tests.test_ship_food_logistics world.tests.test_ship_food_cultivation world.tests.test_ship_water_recycling -v

