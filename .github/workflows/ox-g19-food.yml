name: Ox G19 finite food, cultivation and galley integration

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_food_cultivation.py"
      - "game/world/ship_food_logistics.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_food_cultivation.py"
      - "game/world/tests/test_ship_food_logistics.py"
      - "game/world/tests/test_installed_ship_food.py"
      - "game/world/tests/test_installed_ship_cultivation.py"
      - "game/commands/ship_physics.py"
      - ".github/workflows/ox-g19-food.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_food_cultivation.py"
      - "game/world/ship_food_logistics.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_food_cultivation.py"
      - "game/world/tests/test_ship_food_logistics.py"
      - "game/world/tests/test_installed_ship_food.py"
      - "game/world/tests/test_installed_ship_cultivation.py"
      - "game/commands/ship_physics.py"
      - ".github/workflows/ox-g19-food.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g19-food-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Pure ledger, nutrient conservation, seeded fuzz and legacy water
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile new and coupled physical ship runtime
        run: |
          python -m compileall -q game/world/ship_food_cultivation.py game/world/ship_food_logistics.py game/world/ship_water_recycling.py game/world/continuous_ship_physics.py game/world/ship_crew_access.py game/commands/ship_physics.py game/world/tests/test_ship_food_logistics.py game/world/tests/test_ship_food_cultivation.py game/world/tests/test_installed_ship_food.py
      - name: Run food chain, original hydroponics, and 730-day water conservation
        working-directory: game
        run: |
          python -m unittest world.tests.test_ship_food_logistics world.tests.test_ship_food_cultivation world.tests.test_ship_water_recycling -v

  installed:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Full Evennia local pantry, galley, nutrition, nutrient and safety
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real ship with Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative world
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Real crew and authoritative finite-food operation
        working-directory: game
        run: |
          python -m world.test_runner world.tests.test_installed_ship_food world.tests.test_installed_ship_cultivation --verbosity=2


  compatibility:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Existing G19 regression — ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: electrical-1
            cases: >-
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_actual_mooring_shore_power_import_interlocks_and_safe_undock
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_auxiliary_harnesses_installed_once_and_individually_fused
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_cabin_refit_panel_is_not_the_fan_coil_source
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_cargo_and_cultivation_branches_stop_one_service_not_ship_power
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_cargo_thermal_quality_survives_manifest_split_and_restart
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_common_operational_battery_serves_real_b_bus_and_expires
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_damaged_main_switchboard_really_disconnects_downstream_branch
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_eclss_motor_is_independently_shed_without_disabling_main_bus
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_fitted_battery_charging_consumes_real_generator_cartridges
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_ftl_control_requires_real_b_feeder_and_aborts_on_trip
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_full_authored_graph_and_nonresetting_commission
          - group: electrical-2
            cases: >-
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_generator_cartridge_magazine_tamper_fails_before_any_energy_tick
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_generator_draws_finite_authored_cartridge_stock_without_losing_ship_mass
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_generator_feeder_failure_browns_out_normal_work
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_generator_trips_do_not_destroy_real_refit_buses
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_inherited_cnc_wear_causes_actual_degradation_and_local_fault
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_local_charger_uses_generator_cartridges_and_never_replays
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_local_refuge_fuse_trip_stops_finite_backup
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_lt_motor_fuse_controls_real_propulsion_heat_sink_and_room_cooling
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_machine_shop_power_loss_latches_attended_restart_and_history
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_meter_advances_once_only_and_persists_exactly
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_motor_overcurrent_trip_is_local_and_resets_only_after_clearance
          - group: electrical-3
            cases: >-
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_motor_trip_is_local_not_a_shipwide_blackout
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_nonresetting_electrical_migration_preserves_real_old_meter
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_normal_fire_pump_actual_mist_stops_on_local_motor_fuse
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_one_hab_air_handler_trip_stops_forced_flow_without_isolating_ducts
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_operator_cannot_invent_a_battery_or_unapproved_source
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_power_readout_is_local_and_does_not_oracle_other_rooms
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_preexisting_equipment_faults_survive_service_control_enrolment
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_protected_battery_does_not_create_hidden_msb_backfeed
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_protected_fire_pump_transfer_is_not_a_hidden_main_bus_tie
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_real_breaker_overload_trips_and_requires_reset
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_real_flywheel_bay_works_only_when_surveyed_suited_and_connected
          - group: electrical-4
            cases: >-
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_refuge_backup_finite_island_and_replay
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_refuge_battery_runs_finite_actual_co2_capture_with_no_replay
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_refuge_scrubber_media_replacement_debits_actual_local_stock
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_second_stage_equipment_feeders_installed_from_authentic_rooms
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_suited_bearing_battery_requires_real_survey
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_surveyed_cargo_hold_rejects_finite_heat_through_real_lt_valve
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_tie_requires_elapsed_synchronisation_and_live_source
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_unsurveyed_refuge_scrubber_cannot_supply_invisible_co2_sink
              world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_workshop_rotor_redundant_drive_fuses_do_not_blackout_ship
          - group: water-waste
            cases: >-
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_broken_rotary_waste_interface_cannot_reach_fixed_receiver
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_closed_network_isolation_blocks_real_water_transfer
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_contamination_requires_actual_finite_filtration_and_sample
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_degraded_processor_recovery_really_drops_to_eighty_percent
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_double_treatment_casualty_halts_recovery_not_creating_water
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_essential_power_preserves_drinking_water_but_sheds_recycling
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_hydrogen_byproduct_has_no_unapproved_vacuum_route
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_installed_network_delivers_and_recycles_with_real_receivers
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_local_classified_spares_disposal_requires_survey_and_receipt
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_local_receipt_replay_rejects_remote_and_wrong_roles
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_one_treatment_train_fails_other_carries_domestic_load
              world.tests.test_installed_ship_water_recycling.InstalledWaterRecyclingTests.test_unsealed_cassette_cannot_collect_sanitary_or_hazardous_waste
          - group: crew-physiology
            cases: >-
              world.tests.test_installed_ship_crew_physiology.InstalledCrewPhysiologyTests.test_operator_must_enrol_named_real_ship_character
              world.tests.test_installed_ship_crew_physiology.InstalledCrewPhysiologyTests.test_real_eva_suit_is_one_breathing_source_not_two
              world.tests.test_installed_ship_crew_physiology.InstalledCrewPhysiologyTests.test_two_named_crew_breathe_real_cell_gas_with_restart_safe_ticks
              world.tests.test_installed_ship_crew_physiology.InstalledCrewPhysiologyTests.test_unprotected_crew_in_a_real_leaking_lock_becomes_incapacitated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install existing ship with Evennia
        run: python -m pip install .
      - name: Provision independent disposable installed-world database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Preserve all previous electrical, water and human behaviour
        working-directory: game
        run: |
          python -m world.test_runner ${{ matrix.cases }} --verbosity=2
