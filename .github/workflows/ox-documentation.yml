# Ox-owned documentation quality; upstream Evennia manual is not in scope.
name: Ox documentation consistency

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "INSTALL.md"
      - "ARCHITECTURE.md"
      - "AGENTS.md"
      - ".agents/**"
      - ".github/ci/**"
      - ".github/workflows/ox-*.yml"
      - "contracts/**"
      - "design/**"
      - "scenarios/**"
      - "game/README.md"
      - "services/ai-handler/README.md"
      - "services/interface/README.md"
      - ".github/workflows/ox-documentation.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "INSTALL.md"
      - "ARCHITECTURE.md"
      - "AGENTS.md"
      - ".agents/**"
      - ".github/ci/**"
      - ".github/workflows/ox-*.yml"
      - "contracts/**"
      - "design/**"
      - "scenarios/**"
      - "game/README.md"
      - "services/ai-handler/README.md"
      - "services/interface/README.md"
      - ".github/workflows/ox-documentation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check inherited agent-guidance index
        run: python .agents/tools/clean_rot.py
      - name: Guard workflow path filters and redundant-run policy
        run: python .github/ci/check_ox_ci_scope.py
      - name: Validate local links in Ox-specific Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re
          docs = [
              Path("README.md"), Path("CONTRIBUTING.md"), Path("INSTALL.md"),
              Path("ARCHITECTURE.md"), Path("AGENTS.md"),
              Path("contracts/README.md"), Path("game/README.md"),
              Path("services/ai-handler/README.md"),
              Path("services/interface/README.md"),
          ]
          docs += list(Path("design").rglob("*.md"))
          docs += list(Path("scenarios").rglob("*.md"))
          failures = []
          checked = 0
          for doc in docs:
              content = doc.read_text(encoding="utf-8")
              for match in re.finditer(r"\[[^\]]+\]\(([^)]+)\)", content):
                  dest = match.group(1)
                  if dest.startswith(("https://", "http://", "mailto:", "#")):
                      continue
                  local = unquote(dest.split("#", 1)[0].split("?", 1)[0])
                  if not local:
                      continue
                  checked += 1
                  if not (doc.parent / local).exists():
                      failures.append(f"{doc}: missing {dest}")
          for bad in failures:
              print(bad)
          print(f"Ox docs: {len(docs)} files; {checked} local references checked")
          if failures:
              raise SystemExit(f"{len(failures)} broken local links")
          PY
