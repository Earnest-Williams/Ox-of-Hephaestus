name: Ox G19 indexed personnel and pressure hatches

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_motion_machinery.py"
      - "game/world/ship_indexed_personnel.py"
      - "game/world/ship_hab_sync.py"
      - "game/world/ship_crew_access.py"
      - "game/world/continuous_ship_physics.py"
      - "game/typeclasses/ship_world.py"
      - "game/world/tests/test_ship_indexed_personnel.py"
      - "game/world/tests/test_ship_hab_sync.py"
      - "game/world/tests/test_installed_ship_indexed_personnel.py"
      - "game/world/tests/test_ship_movement.py"
      - ".github/workflows/ox-g19-indexed-personnel.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_motion_machinery.py"
      - "game/world/ship_indexed_personnel.py"
      - "game/world/ship_hab_sync.py"
      - "game/world/ship_crew_access.py"
      - "game/world/continuous_ship_physics.py"
      - "game/typeclasses/ship_world.py"
      - "game/world/tests/test_ship_indexed_personnel.py"
      - "game/world/tests/test_ship_hab_sync.py"
      - "game/world/tests/test_installed_ship_indexed_personnel.py"
      - "game/world/tests/test_ship_movement.py"
      - ".github/workflows/ox-g19-indexed-personnel.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ox-g19-indexed-personnel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile real ship physics and transfer state machines
        run: |
          python -m compileall -q game/world/ship_indexed_personnel.py game/world/ship_hab_sync.py game/world/ship_crew_access.py game/world/ship_motion_machinery.py game/world/continuous_ship_physics.py game/typeclasses/ship_world.py game/world/tests/test_ship_indexed_personnel.py game/world/tests/test_ship_hab_sync.py game/world/tests/test_installed_ship_indexed_personnel.py
      - name: Test finite indexed transfer and rotating equipment
        working-directory: game
        run: python -m unittest world.tests.test_ship_indexed_personnel world.tests.test_ship_hab_sync -v

  installed:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Test real 180/300-second indexed passenger movement and hatch isolation
        working-directory: game
        run: python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_indexed_personnel --verbosity=2

  movement-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Existing real exit movement and G19 motor/cargo coupling remain compatible
        working-directory: game
        run: |
          python -m world.test_runner world.tests.test_ship_crew_access world.tests.test_installed_ship_movement world.tests.test_ship_movement --verbosity=2
