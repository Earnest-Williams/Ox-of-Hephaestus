name: Ox G19 movement, machinery and cargo integration

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_cargo_manifest.py"
      - "game/world/ship_port_operations.py"
      - "game/world/ship_motion_machinery.py"
      - "game/world/ship_ftl_navigation.py"
      - "game/world/tests/test_ship_movement.py"
      - "game/world/tests/test_ship_cargo_manifest.py"
      - "game/world/tests/test_ship_port_operations.py"
      - "game/world/tests/test_ship_ftl_navigation.py"
      - "game/world/tests/test_installed_ship_movement.py"
      - "game/world/tests/test_ship_crew_access.py"
      - "game/world/ship_crew_access.py"
      - "game/world/ship_world.py"
      - "game/typeclasses/ship_world.py"
      - ".github/workflows/ox-g19-movement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g19-movement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  movement:
    # G19 is intentionally a draft integration PR. Run this focused suite
    # before the final whole-ship acceptance gate, including while draft.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: |
          python -m pip install .
          python -m compileall -q game/world/continuous_ship_physics.py game/world/ship_cargo_manifest.py game/world/ship_port_operations.py game/world/ship_motion_machinery.py game/world/ship_ftl_navigation.py game/world/tests/test_ship_movement.py game/world/tests/test_ship_cargo_manifest.py game/world/tests/test_ship_port_operations.py game/world/tests/test_ship_ftl_navigation.py game/world/tests/test_installed_ship_movement.py game/world/tests/test_ship_crew_access.py game/world/ship_crew_access.py game/world/ship_world.py game/typeclasses/ship_world.py
      - name: Provision ephemeral test database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Run pure motion, cargo, FTL and installed-world regressions
        working-directory: game
        run: |
          python -m world.test_runner world.tests.test_ship_movement world.tests.test_ship_cargo_manifest world.tests.test_ship_port_operations world.tests.test_ship_ftl_navigation world.tests.test_installed_ship_movement world.tests.test_ship_crew_access --verbosity=2

  coupled-regression:
    name: G18/G17 casualty and installed-world compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and compile ship physics
        run: |
          python -m pip install .
          python -m compileall -q game/world/continuous_ship_physics.py game/world/full_ship_operations.py game/world/ship_motion_machinery.py game/world/ship_cargo_manifest.py game/world/ship_ftl_navigation.py
      - name: Provision ephemeral test database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Validate legacy coupled ship physics and operations
        working-directory: game
        run: |
          python -m world.test_runner world.tests.test_coupled_casualty world.tests.test_continuous_ship_physics world.tests.test_full_ship_operations --verbosity=2
