name: Ox G19 drum-3 hatch request handover
on:
  push:
    branches: [main, g19/dr03-hatch-request-handover]
    paths:
      - ".github/workflows/ox-dr03-hatch-handover.yml"
      - "game/world/ship_dr03_hatch_policy.py"
      - "game/world/ship_dr03_hatch_handover_world.py"
      - "game/commands/dr03_hatch_handover.py"
      - "game/commands/account_cmdsets.py"
      - "game/commands/default_cmdsets.py"
      - "game/world/tests/test_ship_dr03_hatch_policy.py"
      - "game/world/tests/test_installed_ship_dr03_hatch_handover.py"
      - "game/world/tests/test_installed_ship_network_access.py"
      - "game/world/tests/test_account_command_boundary.py"
      - "game/world/tests/test_character_command_boundary.py"
      - "game/world/ship_access_contact.py"
      - "game/world/ship_access_contact_world.py"
      - "game/world/ship_network_access_world.py"
      - "game/world/ship_dr03_authority_world.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/full_ship_operations.py"
      - "game/world/ship_model.py"
      - "design/ship/ox_full_ship.json"
      - "design/ship/ox_full_ship_v0.5_candidate.json"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/ox-dr03-hatch-handover.yml"
      - "game/world/ship_dr03_hatch_policy.py"
      - "game/world/ship_dr03_hatch_handover_world.py"
      - "game/commands/dr03_hatch_handover.py"
      - "game/commands/account_cmdsets.py"
      - "game/commands/default_cmdsets.py"
      - "game/world/tests/test_ship_dr03_hatch_policy.py"
      - "game/world/tests/test_installed_ship_dr03_hatch_handover.py"
      - "game/world/tests/test_installed_ship_network_access.py"
      - "game/world/tests/test_account_command_boundary.py"
      - "game/world/tests/test_character_command_boundary.py"
      - "game/world/ship_access_contact.py"
      - "game/world/ship_access_contact_world.py"
      - "game/world/ship_network_access_world.py"
      - "game/world/ship_dr03_authority_world.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/full_ship_operations.py"
      - "game/world/ship_model.py"
      - "design/ship/ox_full_ship.json"
      - "design/ship/ox_full_ship_v0.5_candidate.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ox-dr03-hatch-handover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate test selection
        run: |
          python -m compileall -q game/world/ship_dr03_hatch_policy.py game/world/ship_dr03_hatch_handover_world.py game/commands/dr03_hatch_handover.py game/world/tests/test_ship_dr03_hatch_policy.py game/world/tests/test_installed_ship_dr03_hatch_handover.py
          python .github/ci/check_ox_ci_scope.py
          python design/ci/check_world_test_selection.py
      - name: Test request-only hatch authority
        working-directory: game
        run: python -m unittest world.tests.test_ship_dr03_hatch_policy -v
  installed:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: pure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENNIA_SUPERUSER_USERNAME: OxCI
      EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
      OX_PG_DATABASE: ox_dr03_hatch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Evennia and PostgreSQL
        run: python -m pip install .
      - name: Test surveyed hatch handover, physical crew action and command boundaries
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_dr03_hatch_handover world.tests.test_account_command_boundary world.tests.test_character_command_boundary --verbosity=2
