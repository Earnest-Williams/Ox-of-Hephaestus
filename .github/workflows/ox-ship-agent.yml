# Focused native Concordia -> ordinary Evennia command integration. No API keys.
name: Ox AI pump repair integration

on:
  pull_request:
    paths:
      - "game/**"
      - "services/ai-handler/**"
      - ".github/workflows/ox-ship-agent.yml"
  push:
    branches:
      - main
    paths:
      - "game/**"
      - "services/ai-handler/**"
      - ".github/workflows/ox-ship-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-repair:
    name: Native entity drives real ship commands (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Evennia and pinned Concordia
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler[concordia]'
      - name: Compile agent trial and game code
        run: python -m compileall -q game services/ai-handler
      - name: Migrate disposable Evennia database
        working-directory: game
        run: evennia migrate
      - name: Initialize first-run Evennia owner and ship (no model call)
        working-directory: game
        shell: bash
        run: |
          set -o pipefail
          # Evennia's launcher insists on Account #1 before "evennia shell".
          # On a headless Actions runner it otherwise retries the interactive
          # createsuperuser command indefinitely and raises RecursionError.
          # This random password exists only in this disposable job step.
          export EVENNIA_SUPERUSER_USERNAME=OxTrialOwner
          export EVENNIA_SUPERUSER_EMAIL=ox-trial@example.invalid
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(36))')"
          mkdir -p ../.ox-state
          evennia shell --command="from world.bootstrap import build_ship; ship = build_ship(); assert ship['pump']; print('OX_SHIP_BOOTSTRAP_READY')" | tee ../.ox-state/bootstrap.log
          grep -Fq 'OX_SHIP_BOOTSTRAP_READY' ../.ox-state/bootstrap.log

      - name: Drive Concordia and zero-LLM GOAP through the real pump
        working-directory: game
        run: evennia test world.tests.test_agent_repair world.tests.test_goap_repair --verbosity=2
