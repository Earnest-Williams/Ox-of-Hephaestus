name: Ox G19 independent portable emergency CO2 scrubbers

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_portable_air.py"
      - "game/world/tests/test_ship_portable_air.py"
      - "game/world/tests/test_installed_ship_portable_air.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-portable-air.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile fitted portable-air custody and physical ship clock
        run: |
          python -m compileall -q game/world/ship_portable_air.py game/world/continuous_ship_physics.py game/world/tests/test_ship_portable_air.py game/world/tests/test_installed_ship_portable_air.py
      - name: Four fitted portable devices, finite charge and real gas transfer
        working-directory: game
        run: python -m unittest world.tests.test_ship_survival_craft_air -v

  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision original portable equipment and original ship compartments
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Actual worker custody, finite cartridge capture and replay acceptance
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_survival_craft_air --verbosity=2

