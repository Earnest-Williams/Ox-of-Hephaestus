name: Ox G19 six exterior radiator work pads
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_exterior_radiators.py"
      - "game/world/ship_crew_access.py"
      - "game/world/ship_waste_repair_world.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_exterior_radiators.py"
      - "game/world/tests/test_installed_ship_exterior_radiators.py"
      - ".github/workflows/ox-g19-exterior-radiators.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile actual six-pad runtime and spatial access
        run: |
          python -m compileall -q game/world/ship_exterior_radiators.py game/world/ship_crew_access.py game/world/ship_waste_repair_world.py game/world/continuous_ship_physics.py game/world/tests/test_ship_exterior_radiators.py game/world/tests/test_installed_ship_exterior_radiators.py
      - name: Six real radiator pads, thermal inertia and permit safety
        working-directory: game
        run: python -m unittest world.tests.test_ship_exterior_radiators world.tests.test_ship_equipment_repair world.tests.test_ship_eva_operations -v
