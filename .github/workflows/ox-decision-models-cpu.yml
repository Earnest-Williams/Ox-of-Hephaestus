# Branch-only CPU model comparison; does not run on PR/main by default.
name: Ox Laya JevK5 CPU decision experiment
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen3.5-0.8b-ci]
    paths:
      - ".github/workflows/ox-decision-models-cpu.yml"
      - "scenarios/decision_models_trial.py"
      - "services/ai-handler/tests/test_decision_models_trial.py"
permissions:
  contents: read
concurrency:
  group: ox-decision-models-cpu
  cancel-in-progress: false
jobs:
  decision-heads:
    name: Native Concordia choices via Laya and JevK5
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OLLAYA_HOST: 127.0.0.1:11435
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install native Concordia
        run: python -m pip install -e './services/ai-handler[concordia]'
      - name: Offline bounded-choice regression
        run: python -m unittest discover -s services/ai-handler/tests -p test_decision_models_trial.py -v
      - name: Check counterfactual fixture integrity offline
        run: python -m unittest discover -s services/ai-handler/tests -p test_counterfactual_decision_trial.py -v
      - name: Install checksum-verified Ollaya v0.16.0 CPU binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ox-state/decisions/bin
          curl -fL --retry 3 --output .ox-state/decisions/ollaya.tar.zst 'https://github.com/ollaya-dev/ollaya/releases/download/v0.16.0/ollaya-linux-amd64.tar.zst'
          echo '2b99e7d2fec0bd0d05d77b74df43a84e0f0171a33fc7a1494f79b18702f15f32  .ox-state/decisions/ollaya.tar.zst' | sha256sum -c -
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          tar --zstd -xf .ox-state/decisions/ollaya.tar.zst -C .ox-state/decisions/bin
          BIN="$(find .ox-state/decisions/bin -type f -name ollaya -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "$PWD/$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version
      - name: Start local CPU Ollaya server
        shell: bash
        run: |
          set -euo pipefail
          ollaya serve > .ox-state/decisions/server.log 2>&1 &
          echo $! > .ox-state/decisions/server.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:11435/api/version; then exit 0; fi
            if ! kill -0 "$(cat .ox-state/decisions/server.pid)" 2>/dev/null; then tail -n 100 .ox-state/decisions/server.log; exit 1; fi
            sleep 2
          done
          tail -n 100 .ox-state/decisions/server.log
          exit 1
      - name: Pull official model registry releases
        shell: bash
        run: |
          set -euo pipefail
          ollaya pull laya:en
          ollaya pull laya:typed-decisions
          ollaya pull jevk5:4b
          ollaya list
          df -h .
      - name: Laya English G11 paired trial (24 decisions)
        run: |
          python -m scenarios.decision_models_trial --model laya:en --repetitions 3 --output .ox-state/decisions/laya-en.json
      - name: Laya specialist G11 paired trial (24 decisions)
        run: |
          python -m scenarios.decision_models_trial --model laya:typed-decisions --repetitions 3 --output .ox-state/decisions/laya-typed.json
      - name: JevK5-4B G11 paired trial (24 decisions)
        run: |
          python -m scenarios.decision_models_trial --model jevk5:4b --repetitions 3 --output .ox-state/decisions/jevk5-4b.json
      - name: Laya English 48 changed-evidence choices
        run: |
          python -m scenarios.counterfactual_decision_trial \
            --provider ollaya --model laya:en --max-pairs 24 \
            --output .ox-state/decisions/counterfactual-laya-en.json
      - name: Laya specialised 48 changed-evidence choices
        run: |
          python -m scenarios.counterfactual_decision_trial \
            --provider ollaya --model laya:typed-decisions --max-pairs 24 \
            --output .ox-state/decisions/counterfactual-laya-typed.json
      - name: JevK5 48 changed-evidence choices
        run: |
          python -m scenarios.counterfactual_decision_trial \
            --provider ollaya --model jevk5:4b --max-pairs 24 \
            --output .ox-state/decisions/counterfactual-jevk5.json
      - name: Preserve decision-head scores and server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-laya-jevk5-three-pairs
          path: |
            .ox-state/decisions/laya-en.json
            .ox-state/decisions/laya-typed.json
            .ox-state/decisions/jevk5-4b.json
            .ox-state/decisions/counterfactual-laya-en.json
            .ox-state/decisions/counterfactual-laya-typed.json
            .ox-state/decisions/counterfactual-jevk5.json
            .ox-state/decisions/server.log
          retention-days: 7
          if-no-files-found: ignore
