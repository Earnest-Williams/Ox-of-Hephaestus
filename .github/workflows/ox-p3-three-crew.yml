name: Ox P3 live three-crew cooperation

on:
  pull_request:
    paths:
      - "game/**"
      - "services/ai-handler/**"
      - ".github/workflows/ox-p3-three-crew.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "services/ai-handler/**"
      - ".github/workflows/ox-p3-three-crew.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  live-three-crew:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real game and independent handler
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler[transport]'
      - name: Create private disposable identities
        shell: bash
        run: |
          TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          OWNER="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$OWNER"
          echo "OX_PROBE_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_PASSWORD=$OWNER" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_USERNAME=OxTrialOwner" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_EMAIL=owner@example.invalid" >> "$GITHUB_ENV"
      - name: Test actual SQLite-backed crew permissions
        working-directory: game
        run: |
          evennia migrate --noinput
          python -m world.test_runner world.tests.test_live_cooperation --verbosity=2
      - name: Provision three unprivileged characters and initial fault
        working-directory: game
        run: |
          evennia shell --command="from world.transport_probe import provision; provision(); from world.live_crew import fixture_setup; fixture_setup(); print('OX_THREE_CREW_FIXTURE_READY')"
      - name: Run simultaneous normal-client crew cooperation
        shell: bash
        run: |
          set -euo pipefail
          (cd game && evennia start)
          python - <<'PY'
          import socket, time
          for _ in range(90):
              try:
                  with socket.create_connection(("127.0.0.1", 4002), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("External Evennia websocket unavailable")
          PY
          sleep 5
          python -m ox_ai.scenarios.p3c_crew
      - name: Summarize server-side exceptions without echoing client commands
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path('game/server/logs')
          for path in root.glob('*.log'):
              print('OX_DIAGNOSTIC_FILE', path.name)
              lines = path.read_text(errors='replace').splitlines()
              error_indices = [i for i, line in enumerate(lines)
                               if 'Traceback' in line or 'Error:' in line or 'Exception:' in line]
              for i in error_indices[-6:]:
                  for line in lines[max(i-2, 0):min(i+8, len(lines))]:
                      for key in ('OX_PROBE_PASSWORD', 'EVENNIA_SUPERUSER_PASSWORD'):
                          if os.environ.get(key):
                              line = line.replace(os.environ[key], '[REDACTED]')
                      print(line[:230])
          PY
      - name: Stop server to independently score persistent world state
        if: always()
        working-directory: game
        run: evennia stop || true
      - name: Check physical history, chief signoff and watch transfer
        working-directory: game
        run: |
          evennia shell --command="from world.bootstrap import build_ship; s=build_ship(); p=s['pump']; r=s['roster']; ops=[e['operation'] for e in p.db.event_history]; assert p.state=='normal' and p.db.ox_incident_closed and p.db.ox_chief_released and ops==['fault','isolate','repair','commission'], ops; assert r.db.ox_active_engineer==s['chief'].dbref and not r.db.ox_handover_due; assert len(p.db.ox_action_receipts)==3; from world.models import CrewEvent; assert CrewEvent.objects.count()>=9; print('OX_P3C_AUTHORITATIVE_VERDICT_PASS')"
      - name: Archive operator-only individual memories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-p3c-real-crew
          path: .ox-state/p3c-verdict.json
          if-no-files-found: ignore
          retention-days: 7
