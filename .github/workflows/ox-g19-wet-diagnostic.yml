name: G19 wet and H2 diagnostic

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - ".github/workflows/ox-g19-wet-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose installed wet and H2 paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict, deque
          m=json.loads(Path('design/ship/ox_full_ship_v0.5_candidate.json').read_text())
          nodes={x["id"]:x for x in m["service_nodes"]}
          eq={x["id"]:x for x in m["equipment"]}
          edges={x["id"]:x for x in m["service_edges"]}
          iso={x["id"]:x for x in m["isolation_points"]}
          for name in ("POTABLE-TANK-MAIN","WATER-PROC-A","WATER-PROC-B","WASTE-PROC-A",
                       "WASTE-PROC-B","ROT-GREYWATER-A","ROT-GREYWATER-B",
                       "ROT-BLACKWATER-A","ROT-BLACKWATER-B","ROT-POTABLE-WATER-A",
                       "ECLSS-A","ECLSS-A-H2-VENT","ECLSS-A-O2-GEN"):
              e=eq.get(name)
              print("EQ",name, {k:e.get(k) for k in ("current_condition","current_state","normal_state","space_id","attributes")} if e else "ABSENT")
          for name in ("EDGE-BYP-A-H2","ISO-BYP-A-H2-SOURCE","ISO-BYP-A-H2-HULL"):
              print("H2",name,edges.get(name) or iso.get(name))
          for name in ("potable_water","greywater","blackwater"):
              es=[x for x in edges.values() if x["network"]==name]
              ns=[x for x in nodes.values() if x["network"]==name]
              print("NETWORK",name,"nodes",len(ns),"edges",len(es))
              for x in es:
                  if x["normal_state"]!="available":
                      print("NONAVAILABLE",x["id"],x["normal_state"])
              for x in es:
                  if any(word in x["id"] for word in ("FIXED-","ROTARY","WATER-PROC","WASTE-PROC","POTABLE-TANK")):
                      print("SPECIAL",x["id"],x["from_node"],x["to_node"],x["isolator_ids"],x.get("normal_state"))
              adj=defaultdict(set)
              for x in es:
                  if x["normal_state"]!="available": continue
                  adj[x["from_node"]].add(x["to_node"])
                  adj[x["to_node"]].add(x["from_node"])
              def reached(starts):
                  q=deque(starts); seen=set(starts)
                  while q:
                      for k in adj[q.popleft()]:
                          if k not in seen:
                              seen.add(k);q.append(k)
                  return seen
              hab=[x["id"] for x in ns if "-WATER-MAN" in x["id"] or "GREYWATER-MAN" in x["id"] or "BLACKWATER-MAN" in x["id"]]
              if name=="potable_water":
                  origin=["NODE-POTABLE-TANK-MAIN-POTABLE-WATER"]
                  tests=["NODE-WATER-PROC-A-POTABLE-WATER","NODE-WATER-PROC-B-POTABLE-WATER"]
              else:
                  origin=hab
                  tests=["NODE-WASTE-PROC-A-"+name.upper(),"NODE-WASTE-PROC-B-"+name.upper(),
                         "NODE-FIXED-GREY-HOLD" if name=="greywater" else "NODE-FIXED-BLACK-HOLD"]
              seen=reached(origin)
              print("CONNECTED",name,"origins",origin[:4],"size",len(seen),"targets",[(k,k in seen) for k in tests])
          PY
