name: Ox G19 installed hull restoration

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_hull_restoration.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_hull_restoration.py"
      - "game/world/tests/test_installed_ship_hull_restoration.py"
      - ".github/workflows/ox-g19-hull.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_hull_restoration.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_hull_restoration.py"
      - "game/world/tests/test_installed_ship_hull_restoration.py"
      - ".github/workflows/ox-g19-hull.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ox-g19-hull-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hull-pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded hull and live physical state
        run: |
          python -m compileall -q game/world/ship_hull_restoration.py game/world/continuous_ship_physics.py game/world/tests/test_ship_hull_restoration.py game/world/tests/test_installed_ship_hull_restoration.py
      - name: Finite hull stages and spare mass invariants
        working-directory: game
        run: python -m unittest world.tests.test_ship_hull_restoration -v

  hull-installed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Actual local crew hull patch and restoration
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_hull_restoration --verbosity=2
