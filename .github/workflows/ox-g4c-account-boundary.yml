name: Ox G4c restricted account commands

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/commands/account_cmdsets.py"
      - "game/server/conf/settings.py"
      - "game/world/tests/test_account_command_boundary.py"
      - ".github/workflows/ox-g4c-account-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-command-boundary:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install game and handler
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler'
      - name: Verify restricted account and character commands
        working-directory: game
        run: |
          python -m world.test_runner \
            world.tests.test_account_command_boundary \
            world.tests.test_character_command_boundary \
            world.tests.test_character_profiles --verbosity=2
