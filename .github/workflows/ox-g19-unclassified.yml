name: Ox G19 cargo sectors, commercial portals and sealed voids
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_unclassified_spaces.py"
      - "game/world/ship_unclassified_runtime.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_unclassified_spaces.py"
      - "game/world/tests/test_installed_ship_unclassified.py"
      - ".github/workflows/ox-g19-unclassified.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all source and installed tests
        run: |
          python -m compileall -q game/world/ship_unclassified_spaces.py game/world/ship_unclassified_runtime.py game/world/continuous_ship_physics.py game/world/ship_crew_access.py game/world/tests/test_ship_unclassified_spaces.py game/world/tests/test_installed_ship_unclassified.py
      - name: Strict 63-space conservation and manifest authority
        working-directory: game
        run: python -m unittest world.tests.test_ship_unclassified_spaces world.tests.test_ship_industrial_access world.tests.test_ship_cargo_manifest world.tests.test_ship_port_operations -v
