# Optional quantisation experiment. Two independent CPU jobs, one checkpoint revision.
name: Ox Decider 4B Q2 vs Q4 native GGUF
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen3.5-0.8b-ci]
    paths:
      - ".github/workflows/ox-decider-gguf-quants.yml"
      - "scenarios/prepare_decider_gguf.py"
      - "scenarios/decider_gguf_quant_trial.py"
      - "services/ai-handler/tests/test_decider_gguf_quant_trial.py"
permissions:
  contents: read
concurrency:
  group: ox-decider-gguf-quants
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      quant_sha: ${{ steps.pins.outputs.quant_sha }}
      tokenizer_sha: ${{ steps.pins.outputs.tokenizer_sha }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve upstream quant and tokenizer commits once
        id: pins
        run: |
          pip install --quiet 'huggingface_hub>=0.34,<2'
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi()
          q=api.model_info("mradermacher/decider-4b-GGUF").sha
          tok=api.model_info("Mapika/decider-4b-GGUF").sha
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"quant_sha={q}\n")
              out.write(f"tokenizer_sha={tok}\n")
          print(f"Quant repository commit: {q}")
          print(f"Publisher tokenizer/config commit: {tok}")
          PY
  evaluate:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        quant: ["Q2_K", "Q4_K_M"]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_QUANT_COMMIT: ${{ needs.resolve.outputs.quant_sha }}
      HF_TOKENIZER_COMMIT: ${{ needs.resolve.outputs.tokenizer_sha }}
      MODEL_DIR: .ox-state/quant/model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install native Concordia
        run: python -m pip install -e './services/ai-handler[concordia]'
      - name: Install CPU PyTorch and Decider GGUF scoring dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=5,<6' 'numpy<3' 'huggingface_hub>=0.34,<2' jinja2 'llama-cpp-python>=0.3.35,<0.4'
          # GGUF readout does not use flash-linear-attention; avoid installing
          # this optional GPU-heavy training dependency on hosted CPU.
          python -m pip install --no-deps 'decider-ai==1.10.0'
      - name: Offline GGUF contract and native memory/evidence tests
        run: |
          python -m unittest discover -s services/ai-handler/tests -p test_decider_gguf_quant_trial.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_counterfactual_decision_trial.py -v
      - name: Download GGUF from one resolved quant source and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ox-state/quant
          python -m scenarios.prepare_decider_gguf --quant ${{ matrix.quant }} \
            --quant-revision "$HF_QUANT_COMMIT" \
            --tokenizer-revision "$HF_TOKENIZER_COMMIT" \
            --model-dir "$MODEL_DIR" \
            --manifest .ox-state/quant/checkpoint.json
      - name: Genuine native Decider GGUF scoring (G11 and 24 counterfactual pairs)
        shell: bash
        run: |
          set -euo pipefail
          python -m scenarios.decider_gguf_quant_trial --quant ${{ matrix.quant }} \
            --model-dir "$MODEL_DIR" \
            --checkpoint-json .ox-state/quant/checkpoint.json \
            --max-pairs 24 \
            --output .ox-state/quant/decisions.json
      - name: Archive scores and checkpoint provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-decider4b-gguf-${{ matrix.quant }}
          path: |
            .ox-state/quant/decisions.json
            .ox-state/quant/checkpoint.json
          retention-days: 7
          if-no-files-found: ignore
