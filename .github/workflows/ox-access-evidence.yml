name: Ox network access evidence and monitoring contract

on:
  push:
    branches: [main, g19/network-access-history]
    paths:
      - "game/world/ship_access_observations.py"
      - "game/world/ship_model.py"
      - "game/world/ship_crew_access.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/models.py"
      - "game/world/tests/test_ship_access_observations.py"
      - "game/world/tests/test_installed_ship_access_observations.py"
      - "game/world/tests/test_ship_model.py"
      - "design/ship/access_monitoring_v01.json"
      - ".github/ci/check_ox_ci_scope.py"
      - "design/ci/check_world_test_selection.py"
      - ".github/workflows/ox-access-evidence.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_access_observations.py"
      - "game/world/ship_model.py"
      - "game/world/ship_crew_access.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/models.py"
      - "game/world/tests/test_ship_access_observations.py"
      - "game/world/tests/test_installed_ship_access_observations.py"
      - "game/world/tests/test_ship_model.py"
      - "design/ship/access_monitoring_v01.json"
      - ".github/ci/check_ox_ci_scope.py"
      - "design/ci/check_world_test_selection.py"
      - ".github/workflows/ox-access-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-access-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure:
    name: Access plan, provenance, privacy and replay
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the access projection and tests
        run: |
          python -m compileall -q game/world/ship_model.py game/world/ship_access_observations.py game/world/tests/test_ship_access_observations.py game/world/tests/test_installed_ship_access_observations.py
          python .github/ci/check_ox_ci_scope.py
          python design/ci/check_world_test_selection.py
      - name: Run no-database access projection tests
        working-directory: game
        run: python -m unittest world.tests.test_ship_model world.tests.test_ship_access_observations -v

  installed:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: pure
    name: Installed world access history
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENNIA_SUPERUSER_USERNAME: OxCI
      EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
      OX_PG_DATABASE: ox_access_evidence_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install world engine and PostgreSQL-backed tests
        run: python -m pip install .
      - name: Exercise real hatch, crew passage and timed indexed arrival
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_access_observations --verbosity=2
