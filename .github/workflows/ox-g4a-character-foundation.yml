name: Ox G4a character foundation

on:
  pull_request:
    paths:
      - "game/commands/default_cmdsets.py"
      - "game/world/tests/test_character_command_boundary.py"
      - "services/ai-handler/src/ox_ai/agents/crew_blueprints.py"
      - "services/ai-handler/tests/test_character_factory.py"
      - ".github/workflows/ox-g4a-character-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install handler
        run: python -m pip install -e './services/ai-handler'
      - name: Validate blueprint v1 upgrade and v2 semantics
        run: python -m unittest discover -s services/ai-handler/tests -p 'test_character_factory.py' -v
      - name: Compile edited files
        run: python -m compileall -q services/ai-handler/src game/commands/default_cmdsets.py game/world/tests/test_character_command_boundary.py

  world-command-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install world and handler
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler'
      - name: Verify explicit Ox character command set
        working-directory: game
        run: python -m world.test_runner world.tests.test_character_command_boundary world.tests.test_capabilities --verbosity=2
