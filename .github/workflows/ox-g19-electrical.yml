name: Ox G19 complete electrical power and protection

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_electrical_power.py"
      - "game/world/ship_auxiliary_electrical.py"
      - "game/world/ship_refuge_life_support.py"
      - "game/world/ship_refuge_media_service.py"
      - "game/world/ship_equipment_services.py"
      - "game/world/ship_equipment_wear.py"
      - "game/world/ship_cargo_environment.py"
      - "game/world/ship_food_cultivation.py"
      - "design/ship/check_g19_cargo_climate_inventory.py"
      - "design/ship/check_g19_service_equipment_inventory.py"
      - "design/ship/check_g19_electrical_inventory.py"
      - "game/world/tests/test_ship_auxiliary_electrical.py"
      - "game/world/tests/test_ship_refuge_life_support.py"
      - "game/world/tests/test_ship_refuge_media_service.py"
      - "game/world/tests/test_ship_equipment_services.py"
      - "game/world/tests/test_ship_equipment_wear.py"
      - "game/world/tests/test_ship_cargo_environment.py"
      - "game/world/tests/test_ship_food_cultivation.py"
      - "game/world/tests/test_installed_ship_cultivation.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_electrical_power.py"
      - "game/world/tests/test_installed_ship_electrical.py"
      - "game/commands/ship_physics.py"
      - ".github/workflows/ox-g19-electrical.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_electrical_power.py"
      - "game/world/ship_auxiliary_electrical.py"
      - "game/world/ship_refuge_life_support.py"
      - "game/world/ship_refuge_media_service.py"
      - "game/world/ship_equipment_services.py"
      - "game/world/ship_equipment_wear.py"
      - "game/world/ship_cargo_environment.py"
      - "game/world/ship_food_cultivation.py"
      - "design/ship/check_g19_cargo_climate_inventory.py"
      - "design/ship/check_g19_service_equipment_inventory.py"
      - "design/ship/check_g19_electrical_inventory.py"
      - "game/world/tests/test_ship_auxiliary_electrical.py"
      - "game/world/tests/test_ship_refuge_life_support.py"
      - "game/world/tests/test_ship_refuge_media_service.py"
      - "game/world/tests/test_ship_equipment_services.py"
      - "game/world/tests/test_ship_equipment_wear.py"
      - "game/world/tests/test_ship_cargo_environment.py"
      - "game/world/tests/test_ship_food_cultivation.py"
      - "game/world/tests/test_installed_ship_cultivation.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_electrical_power.py"
      - "game/world/tests/test_installed_ship_electrical.py"
      - "game/commands/ship_physics.py"
      - ".github/workflows/ox-g19-electrical.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g19-electrical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile G19 electricity and shared physics
        run: |
          python -m compileall -q game/world/ship_electrical_power.py game/world/ship_auxiliary_electrical.py game/world/ship_refuge_life_support.py game/world/ship_refuge_media_service.py game/world/ship_equipment_services.py game/world/ship_equipment_wear.py game/world/ship_cargo_environment.py game/world/ship_food_cultivation.py game/world/continuous_ship_physics.py game/world/tests/test_ship_electrical_power.py game/world/tests/test_ship_auxiliary_electrical.py game/world/tests/test_ship_refuge_life_support.py game/world/tests/test_ship_refuge_media_service.py game/world/tests/test_ship_equipment_services.py game/world/tests/test_ship_equipment_wear.py game/world/tests/test_ship_cargo_environment.py game/world/tests/test_ship_food_cultivation.py
      - name: Finite electric energy, real source paths, protection and no-backfeed
        working-directory: game
        run: python -m unittest world.tests.test_ship_electrical_power world.tests.test_ship_auxiliary_electrical world.tests.test_ship_refuge_life_support world.tests.test_ship_refuge_media_service world.tests.test_ship_equipment_services world.tests.test_ship_equipment_wear world.tests.test_ship_cargo_environment world.tests.test_ship_food_cultivation -v
      - name: Audit all v0.5 priority motors against original co-located power panels
        run: python design/ship/check_g19_electrical_inventory.py
      - name: Audit 26 auxiliary equipment control feeds against original v0.5 panel locations
        run: python design/ship/check_g19_service_equipment_inventory.py
      - name: Audit all six cargo cooling skids, LT rotary valves and gallery pressure cells
        run: python design/ship/check_g19_cargo_climate_inventory.py

