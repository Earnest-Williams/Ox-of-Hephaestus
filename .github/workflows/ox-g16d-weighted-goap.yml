name: Ox G16d disposition-weighted GOAP contracts

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "contracts/**"
      - "services/ai-handler/src/ox_ai/planning/goap.py"
      - "services/ai-handler/src/ox_ai/runtime/disposition_goap.py"
      - "services/ai-handler/src/ox_ai/agents/crew_blueprints.py"
      - "services/ai-handler/tests/test_g16_goap.py"
      - ".github/workflows/ox-g16d-weighted-goap.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g16d-goap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  disposition-goap:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Finite fractional GOAP and trait-specific plans
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install typed shared contract and model-free handler
        run: |
          python -m pip install -e ./contracts
          python -m pip install -e ./services/ai-handler
      - name: Validate G16d plus existing symbolic GOAP tests
        run: |
          python -m compileall -q services/ai-handler/src/ox_ai/planning/goap.py services/ai-handler/src/ox_ai/runtime/disposition_goap.py
          python -m unittest discover -s services/ai-handler/tests -p test_g16_goap.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_goap_planner.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_goap_crew.py -v
