name: Ox G19 independent survival-craft life support

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_survival_craft_air.py"
      - "game/world/tests/test_ship_survival_craft_air.py"
      - "game/world/tests/test_installed_ship_survival_craft_air.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-survival-air.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile fitted rescue-bay atmosphere and physical ship clock
        run: |
          python -m compileall -q game/world/ship_survival_craft_air.py game/world/continuous_ship_physics.py game/world/tests/test_ship_survival_craft_air.py game/world/tests/test_installed_ship_survival_craft_air.py
      - name: Strict two-craft media, independent runtime and original hatch physics
        working-directory: game
        run: python -m unittest world.tests.test_ship_survival_craft_air -v

  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision original rated rescue compartments and ship records
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Finite installed craft CO2, outage, hatch and crew-work acceptance
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_survival_craft_air --verbosity=2

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision adjacent finite refuge/EVA atmosphere
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Existing finite refuge battery and recovered EVA gas regressions
        working-directory: game
        run: |
          python -m world.test_runner \
            world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_refuge_backup_finite_island_and_replay \
            world.tests.test_installed_ship_eva_major.InstalledEVAMajorDamageTests.test_real_return_eva_repressurises_from_retained_gas \
            --verbosity=2
