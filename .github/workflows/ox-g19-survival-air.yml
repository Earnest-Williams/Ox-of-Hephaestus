name: Ox G19 independent survival-craft life support

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_survival_craft_air.py"
      - "game/world/tests/test_ship_survival_craft_air.py"
      - "game/world/tests/test_installed_ship_survival_craft_air.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-survival-air.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile fitted rescue-bay atmosphere and physical ship clock
        run: |
          python -m compileall -q game/world/ship_survival_craft_air.py game/world/continuous_ship_physics.py game/world/tests/test_ship_survival_craft_air.py game/world/tests/test_installed_ship_survival_craft_air.py
      - name: Strict two-craft media, independent runtime and original hatch physics
        working-directory: game
        run: python -m unittest world.tests.test_ship_survival_craft_air -v

