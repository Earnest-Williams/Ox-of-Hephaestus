# Retained from upstream Evennia for an *explicit* compatibility investigation.
# Ox does NOT run this matrix on pushes or pull requests. Ox supports
# PostgreSQL only (ADR 0010), so the SQLite and MySQL jobs were removed.
# Prefer ox-scaffold.yml and ox-evennia-smoke.yml for ordinary development.
# No upstream Docker image publishing occurs in this fork.

name: Evennia upstream compatibility matrix (manual, PostgreSQL)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-postgresql:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    timeout-minutes: 60

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: evennia
          POSTGRES_USER: evennia
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
        timeout-minutes: 2

      - name: Set up database (postgresql)
        uses: ./.github/actions/setup-database
        with:
          database: postgresql
        timeout-minutes: 5

      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          python-version: ${{ matrix.python-version }}
          testing-db: postgresql
          coverage-test: "false"
          needs-postgres-package: "true"
