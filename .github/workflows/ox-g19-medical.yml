name: Ox G19 finite HAB clinic
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_crew_medical.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_crew_medical.py"
      - "game/world/tests/test_installed_ship_medical.py"
      - ".github/workflows/ox-g19-medical.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile clinical integration
        run: python -m compileall -q game/world/ship_crew_medical.py game/world/continuous_ship_physics.py game/world/tests/test_ship_crew_medical.py game/world/tests/test_installed_ship_medical.py
      - name: Finite medical and physiology invariants
        working-directory: game
        run: python -m unittest world.tests.test_ship_crew_medical world.tests.test_ship_crew_physiology -v
