name: Ox G19 finite HAB clinic
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_crew_medical.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_crew_medical.py"
      - "game/world/tests/test_installed_ship_medical.py"
      - ".github/workflows/ox-g19-medical.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile clinical integration
        run: python -m compileall -q game/world/ship_crew_medical.py game/world/continuous_ship_physics.py game/world/tests/test_ship_crew_medical.py game/world/tests/test_installed_ship_medical.py
      - name: Finite medical and physiology invariants
        working-directory: game
        run: python -m unittest world.tests.test_ship_crew_medical world.tests.test_ship_crew_physiology -v
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install actual Evennia runtime
        run: python -m pip install .
      - name: Provision disposable ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Two-person actual clinic work
        working-directory: game
        run: python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_medical --verbosity=2
