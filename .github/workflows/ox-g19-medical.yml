name: Ox G19 finite medical stabilisation
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - 'game/world/ship_crew_medical.py'
      - 'game/world/tests/test_ship_crew_medical.py'
      - 'game/world/ship_crew_physiology.py'
      - 'game/world/ship_crew_exposure.py'
      - '.github/workflows/ox-g19-medical.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'game/world/ship_crew_medical.py'
      - 'game/world/tests/test_ship_crew_medical.py'
      - 'game/world/ship_crew_physiology.py'
      - 'game/world/ship_crew_exposure.py'
      - '.github/workflows/ox-g19-medical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile medical and physiology kernel
        run: python -m py_compile game/world/ship_crew_medical.py game/world/ship_crew_physiology.py
      - name: Finite medical inventory, care and interruption invariants
        env:
          PYTHONPATH: game
        run: python -m unittest world.tests.test_ship_crew_medical -v
