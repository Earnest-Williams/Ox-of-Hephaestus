name: Ox Qwen 4B CPU G11 experiment
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen3.5-0.8b-ci]
    paths:
      - ".github/workflows/ox-qwen-4b-cpu.yml"
      - "scenarios/g11_memory_ab_trial.py"
permissions:
  contents: read
concurrency:
  group: ox-qwen-4b-cpu
  cancel-in-progress: false
jobs:
  qwen-4b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL_PATH: .ox-model-cache/Qwen3.5-4B-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install Concordia and localhost chat adapter
        run: python -m pip install -e './services/ai-handler[concordia]' 'openai>=1,<3'
      - name: Check G11 fixture parity
        run: python -m unittest discover -s services/ai-handler/tests -p test_concordia_memory_ab.py -v
      - name: Check 24 counterfactual fixtures offline
        run: python -m unittest discover -s services/ai-handler/tests -p test_counterfactual_decision_trial.py -v
      - name: Restore pinned model cache
        uses: actions/cache@v4
        with:
          path: .ox-model-cache/Qwen3.5-4B-Q4_K_M.gguf
          key: ox-unsloth-qwen35-4b-q4km-00fe7986-v1
      - name: Download and verify Qwen3.5-4B Q4_K_M
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ox-model-cache .ox-state/qwen4b
          if [ ! -s "$MODEL_PATH" ]; then
            curl -fL --retry 3 --output "$MODEL_PATH" 'https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf'
          fi
          echo "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4  $MODEL_PATH" | sha256sum -c -
          sha256sum "$MODEL_PATH" > .ox-state/qwen4b/model-sha256.txt
      - name: Download pinned llama.cpp CPU binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ox-state/qwen4b/llama
          curl -fL --retry 3 --output .ox-state/qwen4b/llama.tar.gz 'https://github.com/ggml-org/llama.cpp/releases/download/b11819/llama-b11819-bin-ubuntu-x64.tar.gz'
          echo '98800bd7b1b7bd5f17ff32c0ee6ce2ea6dbcfe77eb58ff9fd96bdad967a4f286  .ox-state/qwen4b/llama.tar.gz' | sha256sum -c -
          tar -xzf .ox-state/qwen4b/llama.tar.gz -C .ox-state/qwen4b/llama
      - name: Start Qwen3.5-4B with CPU-only localhost llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find .ox-state/qwen4b/llama -type f -name llama-server -print -quit)"
          test -n "$SERVER"
          LD_LIBRARY_PATH="$(dirname "$SERVER")" "$SERVER" --model "$MODEL_PATH" --alias qwen3.5-4b --host 127.0.0.1 --port 8080 --ctx-size 4096 --threads 4 --parallel 1 --n-gpu-layers 0 --reasoning off > .ox-state/qwen4b/server.log 2>&1 &
          echo $! > .ox-state/qwen4b/server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then exit 0; fi
            if ! kill -0 "$(cat .ox-state/qwen4b/server.pid)" 2>/dev/null; then tail -n 100 .ox-state/qwen4b/server.log; exit 1; fi
            sleep 2
          done
          tail -n 100 .ox-state/qwen4b/server.log
          exit 1
      - name: Run 24 genuine native Concordia G11 model choices
        run: |
          python scenarios/g11_memory_ab_trial.py --provider qwen-local --local-model qwen3.5-4b --repetitions 3 --output .ox-state/qwen4b/g11-results.json
      - name: Run 48 changed-evidence native Concordia choices
        run: |
          python -m scenarios.counterfactual_decision_trial \
            --provider qwen-local --model qwen3.5-4b \
            --api-base http://127.0.0.1:8080/v1 --max-pairs 24 \
            --output .ox-state/qwen4b/counterfactual-results.json
      - name: Preserve bounded Qwen 4B diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-qwen-4b-three-pairs
          path: |
            .ox-state/qwen4b/g11-results.json
            .ox-state/qwen4b/counterfactual-results.json
            .ox-state/qwen4b/model-sha256.txt
            .ox-state/qwen4b/server.log
          retention-days: 7
          if-no-files-found: ignore
