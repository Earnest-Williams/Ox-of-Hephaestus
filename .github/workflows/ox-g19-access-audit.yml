name: Ox G19 complete authored ship access audit

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_access_audit.py"
      - "game/world/ship_worksite_audit.py"
      - "game/world/ship_freight_service.py"
      - "game/world/continuous_ship_physics.py"
      - "game/commands/ship_physics.py"
      - "game/world/tests/test_ship_access_audit.py"
      - "game/world/tests/test_ship_worksite_audit.py"
      - "game/world/tests/test_ship_freight_service.py"
      - "game/world/tests/test_installed_ship_freight_service.py"
      - "game/world/tests/test_installed_ship_access_audit.py"
      - "game/world/tests/test_installed_ship_operational_routes.py"
      - "game/world/ship_crew_access.py"
      - "game/world/ship_world.py"
      - "game/world/ship_model.py"
      - ".github/workflows/ox-g19-access-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g19-access-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and audit all 517 authored bidirectional links
        run: |
          python -m compileall -q game/world/ship_access_audit.py game/world/ship_worksite_audit.py game/world/ship_freight_service.py game/world/tests/test_ship_freight_service.py game/world/tests/test_installed_ship_freight_service.py game/world/tests/test_ship_access_audit.py game/world/tests/test_ship_worksite_audit.py game/world/tests/test_installed_ship_access_audit.py game/world/tests/test_installed_ship_operational_routes.py
          cd game
          python -m unittest world.tests.test_ship_access_audit world.tests.test_ship_worksite_audit world.tests.test_ship_freight_service -v

