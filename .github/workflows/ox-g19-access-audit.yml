name: Ox G19 complete authored ship access audit

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_access_audit.py"
      - "game/world/ship_worksite_audit.py"
      - "game/world/tests/test_ship_access_audit.py"
      - "game/world/tests/test_ship_worksite_audit.py"
      - "game/world/tests/test_installed_ship_access_audit.py"
      - "game/world/tests/test_installed_ship_operational_routes.py"
      - "game/world/ship_crew_access.py"
      - "game/world/ship_world.py"
      - "game/world/ship_model.py"
      - ".github/workflows/ox-g19-access-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g19-access-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and audit all 517 authored bidirectional links
        run: |
          python -m compileall -q game/world/ship_access_audit.py game/world/ship_worksite_audit.py game/world/tests/test_ship_access_audit.py game/world/tests/test_ship_worksite_audit.py game/world/tests/test_installed_ship_access_audit.py game/world/tests/test_installed_ship_operational_routes.py
          cd game
          python -m unittest world.tests.test_ship_access_audit world.tests.test_ship_worksite_audit -v

  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Audit 421 rooms, 1034 exits, physical drum/HAB boarding and return
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_access_audit world.tests.test_installed_ship_operational_routes --verbosity=2
