name: Ox G16f measured native Decider 6-20-40 throughput
# Isolated first native execution, source PR #119 e9f3ccca5ced

on:
  push:
    branches: [experiment/g16f-native-run]
    paths:
      - "scenarios/profiling/g16f_personality_throughput.py"
      - "services/ai-handler/src/ox_ai/inference/disposition_choice.py"
      - "services/ai-handler/src/ox_ai/runtime/cognition_scheduler.py"
      - "services/ai-handler/src/ox_ai/runtime/g16_decision_controller.py"
      - "contracts/ox_contracts/**"
      - ".github/workflows/ox-g16f-native.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g16f-real-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-decider-throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OX_PERSONALITY_CHOICE: "1"
      MODEL_DIR: .ox-state/g16f/weights
      OX_DECIDER_GGUF_PATH: .ox-state/g16f/weights/decider-4b.Q4_K_M.gguf
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            contracts/pyproject.toml
      - name: Install real Concordia and exact Decider Q4 CPU backend
        run: |
          python -m pip install -e ./contracts
          python -m pip install -e './services/ai-handler[concordia]'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=5,<6' 'numpy<3' 'huggingface_hub>=0.34,<2' jinja2 'llama-cpp-python>=0.3.35,<0.4'
          python -m pip install --no-deps 'decider-ai==1.10.0'
      - name: Prove identical real-Concordia actor scheduler and provenance tests
        run: |
          python -m compileall -q scenarios/profiling/g16f_personality_throughput.py
          python -m unittest discover -s services/ai-handler/tests -p test_g16f_throughput.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_g16_choice.py -v
      - name: Provision exact pinned Decider GGUF and publisher tokenizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          from huggingface_hub import snapshot_download, hf_hub_download, HfApi
          from pathlib import Path
          import os, shutil, hashlib, json
          d = Path(os.environ["MODEL_DIR"])
          qrev = "3b02c98fa0b19e9daab247d633095b6e8a6cd4c5"
          trev = "d3a78581751d518bbfa9e871a6d84059554d53c5"
          snapshot_download(
              repo_id="Mapika/decider-4b-GGUF", revision=trev,
              local_dir=str(d),
              allow_patterns=[
                  "config.json","decider_config.json","tokenizer.json",
                  "tokenizer_config.json","special_tokens_map.json",
                  "*.jinja","vocab.json","merges.txt","added_tokens.json",
              ],
          )
          names = [x.rfilename for x in HfApi().model_info(
              "mradermacher/decider-4b-GGUF",revision=qrev).siblings]
          qs = [n for n in names if n.lower().endswith("q4_k_m.gguf")
                and "/" not in n]
          if len(qs) != 1:
              raise RuntimeError(f"Expected exactly one pinned Q4_K_M: {qs}")
          src = hf_hub_download(
              repo_id="mradermacher/decider-4b-GGUF",
              filename=qs[0], revision=qrev)
          out = d / qs[0]
          if not out.exists():
              shutil.copyfile(src, out)
          expected = d / "decider-4b.Q4_K_M.gguf"
          if out != expected:
              if expected.exists():
                  raise RuntimeError("Conflicting native model")
              expected.symlink_to(out.name)
          digest = hashlib.sha256()
          with out.open("rb") as data:
              while chunk := data.read(8*1024*1024):
                  digest.update(chunk)
          manifest = dict(
              model="decider-q4", hf_revision=qrev,
              tokenizer_revision=trev, sha256=digest.hexdigest(),
              size=out.stat().st_size, source_file=out.name,
          )
          (d.parent / "model-manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8")
          print("OX_G16F_REAL_GGUF_PROVISIONED", manifest)
          PY
      - name: Measure 198 genuine GGUF forward passes across 6 20 40 minds
        shell: bash
        run: |
          set -euo pipefail
          python scenarios/profiling/g16f_personality_throughput.py \
            --engine decider-q4 --mode sequential \
            --gguf-path "$OX_DECIDER_GGUF_PATH" \
            --model-manifest .ox-state/g16f/model-manifest.json \
            --output .ox-state/g16f/native-throughput.json \
            | tee .ox-state/g16f/native-throughput.txt
          grep -Fq OX_G16F_THREE_COHORT_PROFILE_COMPLETE .ox-state/g16f/native-throughput.txt
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path(".ox-state/g16f/native-throughput.json").read_text())
          assert result["native_gguf_forwards_measured"] is True
          assert result["backend"]=="decider-q4"
          assert result["forward_calls"]==198
          assert [c["actors"] for c in result["measured_cohorts"]]==[6,20,40]
          assert result["maximum_concurrent_native_forwards"]==1
          assert all(c["decisions_completed"]==c["actors"] for c in result["measured_cohorts"])
          assert result["evennia_commands_sent"]==0
          print("OX_G16F_REAL_NATIVE_CPU_THROUGHPUT_RECORDED")
          PY
      - name: Retain measured native latencies and exact model provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-g16f-actual-q4-cpu-six-twenty-forty
          path: |
            .ox-state/g16f/native-throughput.json
            .ox-state/g16f/native-throughput.txt
            .ox-state/g16f/model-manifest.json
          retention-days: 21
          if-no-files-found: ignore
