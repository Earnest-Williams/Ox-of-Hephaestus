name: Ox G19 finite waste offload and equipment repairs

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_waste_offload.py"
      - "game/world/ship_equipment_repair.py"
      - "game/world/ship_waste_repair_world.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/tests/test_ship_waste_offload.py"
      - "game/world/tests/test_ship_equipment_repair.py"
      - "game/world/tests/test_installed_ship_waste_repair.py"
      - ".github/workflows/ox-g19-waste-repair.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_waste_offload.py"
      - "game/world/ship_equipment_repair.py"
      - "game/world/ship_waste_repair_world.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/tests/test_ship_waste_offload.py"
      - "game/world/tests/test_ship_equipment_repair.py"
      - "game/world/tests/test_installed_ship_waste_repair.py"
      - ".github/workflows/ox-g19-waste-repair.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ox-g19-waste-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Compile real coupled source
        run: |
          python -m compileall -q game/world/continuous_ship_physics.py game/world/ship_water_recycling.py game/world/ship_waste_offload.py game/world/ship_equipment_repair.py game/world/ship_waste_repair_world.py game/world/tests/test_ship_waste_offload.py game/world/tests/test_ship_equipment_repair.py game/world/tests/test_installed_ship_waste_repair.py
          python design/ship/check_waste_byproducts.py > /dev/null
          python design/ship/check_physical_operations.py > /dev/null
      - name: Pure waste material and shared repair conservation
        working-directory: game
        run: |
          python -m unittest world.tests.test_ship_waste_offload world.tests.test_ship_equipment_repair world.tests.test_ship_water_recycling world.tests.test_ship_water_materials world.tests.test_ship_water_fuzz -v

  installed:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Real port offload, spare custody, repair and G19 water compatibility
        working-directory: game
        run: |
          python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_waste_repair --verbosity=2

  water-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Existing installed water system must remain compatible
        working-directory: game
        run: |
          python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_water_recycling --verbosity=2

  g18-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Existing full-ship fire pressure gas thermal damage and casualty regressions
        working-directory: game
        run: |
          python -m world.test_runner --prebuilt-ship world.tests.test_continuous_ship_physics world.tests.test_coupled_casualty --verbosity=2

  movement-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Existing installed cargo mechanics movement and port regressions
        working-directory: game
        run: |
          python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_movement --verbosity=2
