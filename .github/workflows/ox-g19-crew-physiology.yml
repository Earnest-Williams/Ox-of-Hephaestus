name: Ox G19 installed crew physiology

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_crew_exposure.py"
      - "game/world/ship_crew_physiology.py"
      - "game/world/ship_eva_operations.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_crew_physiology.py"
      - "game/world/tests/test_installed_ship_crew_physiology.py"
      - ".github/workflows/ox-g19-crew-physiology.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_crew_exposure.py"
      - "game/world/ship_crew_physiology.py"
      - "game/world/ship_eva_operations.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_crew_physiology.py"
      - "game/world/tests/test_installed_ship_crew_physiology.py"
      - ".github/workflows/ox-g19-crew-physiology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g19-crew-physiology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrated crew and pressure physics
        run: |
          python -m compileall -q game/world/ship_crew_exposure.py game/world/ship_crew_physiology.py game/world/ship_eva_operations.py game/world/continuous_ship_physics.py game/world/tests/test_ship_crew_physiology.py game/world/tests/test_installed_ship_crew_physiology.py
      - name: Finite human exposure and gas mass invariants
        working-directory: game
        run: python -m unittest world.tests.test_ship_crew_exposure world.tests.test_ship_crew_physiology world.tests.test_ship_eva_operations -v

  installed:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real Evennia
        run: python -m pip install .
      - name: Provision disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Two-person real-ship respiration and casualty recovery
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_crew_physiology --verbosity=2
