name: Ox G4f verified physical-work practice

on:
  pull_request:
    paths:
      - "game/world/**"
      - "game/typeclasses/**"
      - ".github/workflows/ox-g4f-receipt-learning.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  receipt-only-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install world and handler
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler'
      - name: Compile and check migration drift
        run: |
          python -m compileall -q game/world game/commands game/typeclasses
          cd game
          DJANGO_SETTINGS_MODULE=server.conf.settings python -m django makemigrations world --check --dry-run
      - name: Verify receipt-coupled practice and existing world protections
        working-directory: game
        run: |
          python -m world.test_runner \
            world.tests.test_receipt_learning \
            world.tests.test_character_learning \
            world.tests.test_character_profiles \
            world.tests.test_task_resolution \
            world.tests.test_work_receipts \
            world.tests.test_captain_followthrough \
            world.tests.test_adversarial_transactions \
            world.tests.test_adversarial_voyage --verbosity=2
