name: Ox G19 original propulsion bay service and restart
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_propulsion_bay_service.py"
      - "game/world/ship_propulsion_proof.py"
      - "game/world/ship_crew_access.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_propulsion_bay_service.py"
      - "game/world/tests/test_installed_ship_propulsion_bay.py"
      - ".github/workflows/ox-g19-propulsion-bay.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile real pressure hatch and world control
        run: |
          python -m compileall -q game/world/ship_propulsion_bay_service.py game/world/ship_crew_access.py game/world/continuous_ship_physics.py game/world/tests/test_ship_propulsion_bay_service.py game/world/tests/test_installed_ship_propulsion_bay.py
      - name: Pure gas, hatch differential, single-worker permit and no gas duplication
        working-directory: game
        run: python -m unittest world.tests.test_ship_propulsion_bay_service world.tests.test_ship_propulsion_proof -v
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install canonical Evennia engine
        run: python -m pip install .
      - name: Provision transient as-built starship
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Original rated suited entry, real controller repair and positive restart
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_propulsion_bay world.tests.test_installed_ship_propulsion_proof world.tests.test_installed_ship_propulsion_exterior --verbosity=2
