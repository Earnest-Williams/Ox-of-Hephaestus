name: Ox personality real Decider vs Qwen live pump
on:
  push:
    branches: [experiment/personality-goap-cognition-routing]
    paths:
      - ".github/workflows/ox-personality-models-live.yml"
      - "services/ai-handler/src/ox_ai/inference/decider_gguf_choice.py"
      - "services/ai-handler/src/ox_ai/scenarios/p4a_personality_gate.py"
      - "services/ai-handler/tests/test_personality_live_models.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ox-personality-models-live
  cancel-in-progress: true
jobs:
  matched-real-models:
    name: Model ${{ matrix.model }} with one world-observed P4a choice
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: decider-q4, branch: decider}
          - {model: qwen-q4, branch: qwen}
    env:
      OX_MODEL: ${{ matrix.model }}
      OX_BRANCH: ${{ matrix.branch }}
      MODEL_DIR: .ox-state/personality-model/weights
      OX_DECIDER_GGUF_PATH: .ox-state/personality-model/weights/decider-4b.Q4_K_M.gguf
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install world, native Concordia and local model dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python -m pip install -e './services/ai-handler[concordia,transport]'
          if [ "$OX_BRANCH" = "decider" ]; then
            python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
            python -m pip install 'transformers>=5,<6' 'numpy<3' 'huggingface_hub>=0.34,<2' jinja2 'llama-cpp-python>=0.3.35,<0.4'
            python -m pip install --no-deps 'decider-ai==1.10.0'
          else
            python -m pip install 'openai>=1,<3'
          fi
      - name: Run scored-decision and coverage contracts
        run: |
          python -m unittest discover -s services/ai-handler/tests -p test_personality_live_models.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_personality_routing.py -v
      - name: Provision Q4 Decider GGUF pinned weights and publisher tokenizer
        if: ${{ matrix.branch == 'decider' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          from huggingface_hub import snapshot_download,hf_hub_download
          from pathlib import Path
          import os,shutil,hashlib,json
          d=Path(os.environ["MODEL_DIR"])
          qrev="3b02c98fa0b19e9daab247d633095b6e8a6cd4c5"
          trev="d3a78581751d518bbfa9e871a6d84059554d53c5"
          snapshot_download(repo_id="Mapika/decider-4b-GGUF",revision=trev,
              local_dir=str(d),allow_patterns=["config.json","decider_config.json",
                  "tokenizer.json","tokenizer_config.json","special_tokens_map.json",
                  "*.jinja","vocab.json","merges.txt","added_tokens.json"])
          from huggingface_hub import HfApi
          names=[x.rfilename for x in HfApi().model_info(
              "mradermacher/decider-4b-GGUF",revision=qrev).siblings]
          qs=[n for n in names if n.lower().endswith("q4_k_m.gguf") and "/" not in n]
          if len(qs)!=1:raise RuntimeError(f"Expected one Q4_K_M: {qs}")
          src=hf_hub_download(repo_id="mradermacher/decider-4b-GGUF",
              filename=qs[0],revision=qrev)
          out=d/qs[0]
          if not out.exists():shutil.copyfile(src,out)
          expected=d/"decider-4b.Q4_K_M.gguf"
          if out!=expected:
              if expected.exists():raise RuntimeError("Unexpected existing model")
              expected.symlink_to(out.name)
          h=hashlib.sha256()
          with out.open("rb") as f:
              while piece:=f.read(8*1024*1024):h.update(piece)
          m=dict(model="decider-q4",hf_revision=qrev,tokenizer_revision=trev,
                 sha256=h.hexdigest(),size=out.stat().st_size,source_file=out.name)
          (d.parent/"model-manifest.json").write_text(json.dumps(m,indent=2))
          print(m)
          PY
      - name: Fetch and verify Qwen3.5-4B Q4_K_M pinned GGUF
        if: ${{ matrix.branch == 'qwen' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          curl -fL --retry 3 --output "$MODEL_DIR/Qwen3.5-4B-Q4_K_M.gguf" \
            'https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf'
          echo "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4  $MODEL_DIR/Qwen3.5-4B-Q4_K_M.gguf" | sha256sum -c -
          sha256sum "$MODEL_DIR/Qwen3.5-4B-Q4_K_M.gguf" > "$MODEL_DIR/../model-sha256.txt"
      - name: Start pinned CPU-only llama.cpp Qwen server
        if: ${{ matrix.branch == 'qwen' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ox-state/personality-model/llama
          curl -fL --retry 3 --output .ox-state/personality-model/llama.tar.gz \
            'https://github.com/ggml-org/llama.cpp/releases/download/b11819/llama-b11819-bin-ubuntu-x64.tar.gz'
          echo '98800bd7b1b7bd5f17ff32c0ee6ce2ea6dbcfe77eb58ff9fd96bdad967a4f286  .ox-state/personality-model/llama.tar.gz' | sha256sum -c -
          tar -xzf .ox-state/personality-model/llama.tar.gz -C .ox-state/personality-model/llama
          SERVER="$(find .ox-state/personality-model/llama -type f -name llama-server -print -quit)"
          test -n "$SERVER"
          LD_LIBRARY_PATH="$(dirname "$SERVER")" "$SERVER" \
             --model "$MODEL_DIR/Qwen3.5-4B-Q4_K_M.gguf" \
             --alias qwen3.5-4b --host 127.0.0.1 --port 8080 \
             --ctx-size 4096 --threads 4 --parallel 1 --n-gpu-layers 0 --reasoning off \
             > .ox-state/personality-model/llama-server.log 2>&1 &
          echo $! > .ox-state/personality-model/llama-server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then exit 0; fi
            if ! kill -0 "$(cat .ox-state/personality-model/llama-server.pid)" 2>/dev/null; then
              tail -n 120 .ox-state/personality-model/llama-server.log
              exit 1
            fi
            sleep 2
          done
          exit 1
      - name: Provision real Evennia accounts and cooling incident
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          OWNER="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$OWNER"
          echo "OX_PROBE_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_PASSWORD=$OWNER" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_USERNAME=OxModelTrialOwner" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_EMAIL=modeltrial@example.invalid" >> "$GITHUB_ENV"
          (cd game && evennia migrate --noinput)
          (cd game && evennia shell --command="from world.transport_probe import provision; provision(); from world.live_crew import fixture_setup; fixture_setup(); print('OX_MODEL_WORLD_READY')")
      - name: Start real Evennia process
        shell: bash
        run: |
          set -euo pipefail
          (cd game && evennia start)
          python - <<'PY'
          import socket,time
          stable=None
          for _ in range(120):
              try:
                  with socket.create_connection(("127.0.0.1",4002),timeout=1):pass
              except OSError:stable=None
              else:
                  stable=stable or time.monotonic()
                  if time.monotonic()-stable>=8:break
              time.sleep(1)
          else:raise RuntimeError("Game websocket not stable")
          PY
      - name: One true model-routed incident choice and consequences
        shell: bash
        run: |
          set -euo pipefail
          python -m ox_ai.scenarios.p4a_personality_gate \
            --persona independent --expect-route llm --model "$OX_MODEL" \
            --checkpoint .ox-state/personality-model/route.json \
            --verdict .ox-state/personality-model/verdict.json \
            | tee .ox-state/personality-model/trial.log
          python - <<'PY'
          import json,os
          r=json.load(open(".ox-state/personality-model/verdict.json"))
          assert r["route"]=="llm" and r["model"]==os.environ["OX_MODEL"],r
          assert r["model_calls"]==1,r
          assert r["status"] in ("isolated_verified","deferred_no_isolation"),r
          assert r["world_commands_sent"]==(1 if r["status"]=="isolated_verified" else 0),r
          print("OX_REAL_MODEL_WORLD_CHOICE_PASS",r["model"],r["status"])
          PY
      - name: Stop world for independent authoritative state inspection
        if: always()
        working-directory: game
        run: evennia stop || true
      - name: Confirm action existence and state, separately from model claims
        working-directory: game
        run: |
          evennia shell --command="import json; from world.bootstrap import build_ship; s=build_ship(); p=s['pump']; r=json.load(open('../.ox-state/personality-model/verdict.json')); isolated=r['status']=='isolated_verified'; expect='isolated' if isolated else 'low_pressure'; ops=[e['operation'] for e in p.db.event_history]; assert p.state==expect,(p.state,expect); assert ops==(['fault','isolate'] if isolated else ['fault']),ops; print('OX_REAL_MODEL_WORLD_AUTHORITY_PASS')"
      - name: Archive real actor choice and world work evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-personality-real-${{ matrix.model }}
          path: |
            .ox-state/personality-model/route.json
            .ox-state/personality-model/route.brain.json
            .ox-state/personality-model/verdict.json
            .ox-state/personality-model/trial.log
            .ox-state/personality-model/model-manifest.json
            .ox-state/personality-model/model-sha256.txt
            .ox-state/personality-model/llama-server.log
          retention-days: 14
          if-no-files-found: ignore
