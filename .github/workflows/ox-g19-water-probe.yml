name: G19 temporary wet-network topology probe

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - ".github/workflows/ox-g19-water-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print selected installed service topology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('design/ship/ox_full_ship_v0.5_candidate.json').read_text())
          ids={'POTABLE-TANK-MAIN','WATER-PROC-A','WATER-PROC-B','WASTE-PROC-A','WASTE-PROC-B',
              'FIXED-GREY-HOLD','FIXED-BLACK-HOLD','HAB-01-POTABLE-WATER-MAN',
              'HAB-01-GREYWATER-MAN','HAB-01-BLACKWATER-MAN'}
          print('INVENTORY-LOCATIONS')
          for x in m['inventories']:
              if x['id'] in ('INV-SPARES','INV-DC-CONSUMABLES','INV-WATER-NORMAL','INV-WATER-RESERVE'):
                  print(x['id'],x.get('location_ids'),x.get('location_allocations_t'))
          print('SOURCE-NODES')
          for x in m['service_nodes']:
              if x['owner_id'] in ids and x['network'] in ('potable_water','greywater','blackwater','power'):
                  print(x['id'],x['owner_id'],x['network'])
          print('ROTARY-EDGES')
          for x in m['service_edges']:
              if x['network'] in ('potable_water','greywater','blackwater') and (
                  'ROTARY-UTIL-A' in x.get('route_spaces',[]) or
                  'ROTARY-UTIL-B' in x.get('route_spaces',[]) or
                  'ROTARY' in x['id']):
                  print(x['id'],x['network'],x['from_node'],x['to_node'],x['isolator_ids'])
          print('POWER-SOURCES')
          for x in m['service_nodes']:
              if x['network']=='power' and (
                  'PROC' in x['owner_id'] or 'WATER' in x['owner_id'] or
                  'WASTE' in x['owner_id']):
                  print(x['id'],x['owner_id'])
          PY
