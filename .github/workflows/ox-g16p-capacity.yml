name: Ox G16p measured capacity and durable queue

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "services/ai-handler/src/ox_ai/runtime/capacity_scheduler.py"
      - "services/ai-handler/src/ox_ai/runtime/cognition_scheduler.py"
      - "services/ai-handler/tests/test_g16p_capacity_scheduler.py"
      - "scenarios/profiling/g16p_admitted_native_queue.py"
      - ".github/workflows/ox-g16p-capacity.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g16p-capacity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measured-admission-and-recovery:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual Concordia and strict contracts
        run: |
          python -m pip install -e ./contracts
          python -m pip install -e './services/ai-handler[concordia]'
      - name: Verify bounded admission and both durable controller contracts
        run: |
          python -m unittest discover -s services/ai-handler/tests -p test_g16p_capacity_scheduler.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_cognition_scheduler.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_g16o_binary_choice.py -v
          python scenarios/profiling/g16p_admitted_native_queue.py --engine fixture --output .ox-state/g16p/fixture.json
      - name: Retain explicitly synthetic admission fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-g16p-admission-fixture
          path: .ox-state/g16p/fixture.json
          retention-days: 14
          if-no-files-found: ignore
