name: Ox G19 drum-3 physical access contact

on:
  push:
    branches: [main, g19/drum3-access-contact]
    paths:
      - "game/world/ship_access_contact.py"
      - "game/world/ship_access_contact_world.py"
      - "game/world/apps.py"
      - "game/world/ship_access_observations.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_control_gateway.py"
      - "game/world/ship_mind_support.py"
      - "game/world/ship_mind_support_world.py"
      - "game/world/models.py"
      - "game/world/tests/test_ship_access_contact.py"
      - "game/world/tests/test_installed_ship_access_contact.py"
      - "design/ship/access_monitoring_v01.json"
      - ".github/workflows/ox-dr3-access-contact.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_access_contact.py"
      - "game/world/ship_access_contact_world.py"
      - "game/world/apps.py"
      - "game/world/ship_access_observations.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/ship_control_gateway.py"
      - "game/world/ship_mind_support.py"
      - "game/world/ship_mind_support_world.py"
      - "game/world/models.py"
      - "game/world/tests/test_ship_access_contact.py"
      - "game/world/tests/test_installed_ship_access_contact.py"
      - "design/ship/access_monitoring_v01.json"
      - ".github/workflows/ox-dr3-access-contact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-dr3-contact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure:
    name: Surveyed local contact identity and event-time evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate physical contact and scoped CI
        run: |
          python -m compileall -q game/world/apps.py game/world/ship_access_contact.py game/world/ship_access_contact_world.py game/world/tests/test_ship_access_contact.py game/world/tests/test_installed_ship_access_contact.py
          python .github/ci/check_ox_ci_scope.py
          python design/ci/check_world_test_selection.py
      - name: Verify drum-3 physical route and proof contracts
        working-directory: game
        run: python -m unittest world.tests.test_ship_access_contact -v

  installed:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: pure
    name: Live 50 W gateway and hatch contact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENNIA_SUPERUSER_USERNAME: OxCI
      EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
      OX_PG_DATABASE: ox_dr3_contact_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Evennia with PostgreSQL
        run: python -m pip install .
      - name: Test real hatch actions, local contact, power loss and damage
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_access_contact --verbosity=2
