# Large full-weight 4B model requires extra virtual memory on hosted CPU.
# Branch-only model experiment, never a default PR/main gate.
name: Ox Decider 4B CPU decision comparison
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen3.5-0.8b-ci]
    paths:
      - ".github/workflows/ox-decider-4b-cpu.yml"
permissions:
  contents: read
concurrency:
  group: ox-decider-4b-cpu
  cancel-in-progress: false
jobs:
  decider-4b:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      OLLAYA_HOST: 127.0.0.1:11435
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Record runner resources and enable bounded swap
        shell: bash
        run: |
          set -euo pipefail
          free -h
          df -h /
          nproc
          # Ollaya's full-weight CPU 4B model has been measured near 21 GiB RAM.
          # Standard hosted CPUs may have less; fail if swap cannot be supplied.
          # GitHub's image already has /swapfile (3 GiB) enabled.
          # Use a distinct swapfile to avoid "Text file busy".
          sudo fallocate -l 16G /mnt/ox-decider4b.swap
          sudo chmod 600 /mnt/ox-decider4b.swap
          sudo mkswap /mnt/ox-decider4b.swap
          sudo swapon /mnt/ox-decider4b.swap
          free -h
      - name: Install pinned native Concordia
        run: python -m pip install -e './services/ai-handler[concordia]'
      - name: Check finite-choice and counterfactual tests offline
        run: |
          python -m unittest discover -s services/ai-handler/tests -p test_decision_models_trial.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_counterfactual_decision_trial.py -v
      - name: Install checksum-verified Ollaya v0.16.0 CPU binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ox-state/decider4b/bin
          curl --fail --location --retry 3 --output .ox-state/decider4b/ollaya.tar.zst \
            'https://github.com/ollaya-dev/ollaya/releases/download/v0.16.0/ollaya-linux-amd64.tar.zst'
          echo '2b99e7d2fec0bd0d05d77b74df43a84e0f0171a33fc7a1494f79b18702f15f32  .ox-state/decider4b/ollaya.tar.zst' | sha256sum -c -
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          tar --zstd -xf .ox-state/decider4b/ollaya.tar.zst -C .ox-state/decider4b/bin
          BIN="$(find .ox-state/decider4b/bin -type f -name ollaya -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "$PWD/$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version
      - name: Start Ollaya localhost only
        shell: bash
        run: |
          set -euo pipefail
          ollaya serve > .ox-state/decider4b/server.log 2>&1 &
          echo $! > .ox-state/decider4b/server.pid
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:11435/api/version; then exit 0; fi
            if ! kill -0 "$(cat .ox-state/decider4b/server.pid)" 2>/dev/null; then
              tail -n 100 .ox-state/decider4b/server.log
              exit 1
            fi
            sleep 2
          done
          tail -n 100 .ox-state/decider4b/server.log
          exit 1
      - name: Pull only registry-pinned Decider 4B
        shell: bash
        run: |
          set -euo pipefail
          ollaya pull decider:4b
          ollaya list
          df -h .
      - name: Decider 4B native Concordia G11 (8 choices)
        run: |
          python -m scenarios.decision_models_trial \
            --model decider:4b --repetitions 1 \
            --output .ox-state/decider4b/g11-results.json
      - name: Decider 4B complete counterfactual evaluation (48 choices)
        run: |
          python -m scenarios.counterfactual_decision_trial \
            --provider ollaya --model decider:4b --max-pairs 24 \
            --output .ox-state/decider4b/counterfactual-results.json
      - name: Archive scores and resource diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-decider4b-cpu-comparison
          path: |
            .ox-state/decider4b/g11-results.json
            .ox-state/decider4b/counterfactual-results.json
            .ox-state/decider4b/server.log
          if-no-files-found: ignore
          retention-days: 7
