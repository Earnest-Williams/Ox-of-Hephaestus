name: Ox G19 exterior crawlers and drum inspection robots

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_exterior_mobile.py"
      - "game/world/tests/test_ship_exterior_mobile.py"
      - "game/world/tests/test_installed_ship_exterior_mobile.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-exterior-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile fitted exterior mobile robots and ship clock
        run: |
          python -m compileall -q game/world/ship_exterior_mobile.py game/world/continuous_ship_physics.py game/world/tests/test_ship_exterior_mobile.py game/world/tests/test_installed_ship_exterior_mobile.py
      - name: "Original rail links, finite energy, scan and recovery"
        working-directory: game
        run: python -m unittest world.tests.test_ship_exterior_mobile -v

