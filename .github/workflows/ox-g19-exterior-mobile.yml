name: Ox G19 exterior crawlers and drum inspection robots

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_exterior_mobile.py"
      - "game/world/tests/test_ship_exterior_mobile.py"
      - "game/world/tests/test_installed_ship_exterior_mobile.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-exterior-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile fitted exterior mobile robots and ship clock
        run: |
          python -m compileall -q game/world/ship_exterior_mobile.py game/world/continuous_ship_physics.py game/world/tests/test_ship_exterior_mobile.py game/world/tests/test_installed_ship_exterior_mobile.py
      - name: "Original rail links, finite energy, scan and recovery"
        working-directory: game
        run: python -m unittest world.tests.test_ship_exterior_mobile -v

  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision original pressure cells, EVA and rotor fittings
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Real EVA airlock robot launch, true rail travel and independent crawler recovery
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_exterior_mobile --verbosity=2

