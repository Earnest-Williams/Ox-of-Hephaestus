name: Ox G19 drum-3 local-first valve arbitration
on:
  push:
    branches: [main, g19/drum3-local-remote-arbitration]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ox-dr03-arbitration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate CI selection
        run: |
          python -m compileall -q game/world/ship_dr03_authority.py game/world/ship_dr03_authority_world.py game/commands/dr03_control.py game/world/tests/test_ship_dr03_authority.py game/world/tests/test_installed_ship_dr03_authority.py
          python .github/ci/check_ox_ci_scope.py
          python design/ci/check_world_test_selection.py
      - name: Test bounded local-first authority and padlocks
        working-directory: game
        run: python -m unittest world.tests.test_ship_dr03_authority -v
  installed:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: pure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENNIA_SUPERUSER_USERNAME: OxCI
      EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
      OX_PG_DATABASE: ox_dr3_control_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Evennia and PostgreSQL
        run: python -m pip install .
      - name: Test remote request, local takeover and dark backbone
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_dr03_authority world.tests.test_account_command_boundary world.tests.test_character_command_boundary --verbosity=2
