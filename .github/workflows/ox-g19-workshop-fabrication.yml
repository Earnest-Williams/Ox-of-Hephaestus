name: Ox G19 finite physical workshop production
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_workshop_fabrication.py"
      - "game/world/ship_workshop_dynamics.py"
      - "game/world/ship_equipment_repair.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_workshop_fabrication.py"
      - "game/world/tests/test_installed_ship_workshop_fabrication.py"
      - ".github/workflows/ox-g19-workshop-fabrication.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile physical workshop and world integration
        run: python -m compileall -q game/world/ship_workshop_fabrication.py game/world/continuous_ship_physics.py game/world/tests/test_ship_workshop_fabrication.py game/world/tests/test_installed_ship_workshop_fabrication.py
      - name: Pure manufacturing, spindle, conservation and real maintenance
        working-directory: game
        run: python -m unittest world.tests.test_ship_workshop_fabrication world.tests.test_ship_workshop_dynamics world.tests.test_ship_equipment_repair -v
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install actual Evennia runtime
        run: python -m pip install .
      - name: Provision disposable original ship world
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Installed hand-carried blanks, running spindle, finished spares and cassette
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_workshop_fabrication --verbosity=2
