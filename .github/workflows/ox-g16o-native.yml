name: Ox G16o binary capacity on three independent native runners

on:
  push:
    branches: [experiment/g16o-native-run]
    paths:
      - "scenarios/profiling/g16o_binary_capacity.py"
      - "services/ai-handler/src/ox_ai/inference/position_balanced_choice.py"
      - "services/ai-handler/src/ox_ai/inference/disposition_choice.py"
      - "services/ai-handler/src/ox_ai/runtime/g16_decision_controller.py"
      - "services/ai-handler/src/ox_ai/runtime/personality_choice_ledger.py"
      - "services/ai-handler/tests/test_g16o*.py"
      - ".github/workflows/ox-g16o-native.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g16o-native-queue-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary-host-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner-sample: [1, 2, 3]
    env:
      G16O_RUNNER_SAMPLE: ${{ matrix.runner-sample }}
      MODEL_DIR: .ox-state/g16o/weights
      OX_DECIDER_GGUF_PATH: .ox-state/g16o/weights/decider-4b.Q4_K_M.gguf
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            contracts/pyproject.toml
      - name: Install real Concordia and exact Decider Q4 CPU backend
        run: |
          python -m pip install -e ./contracts
          python -m pip install -e './services/ai-handler[concordia]'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=5,<6' 'numpy<3' 'huggingface_hub>=0.34,<2' jinja2 'llama-cpp-python>=0.3.35,<0.4'
          python -m pip install --no-deps 'decider-ai==1.10.0'
      - name: Verify actual binary controller before real measurement
        run: |
          python -m unittest discover -s services/ai-handler/tests -p 'test_g16o*.py' -v
      - name: Provision exact pinned Decider GGUF and publisher tokenizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          from huggingface_hub import snapshot_download, hf_hub_download, HfApi
          from pathlib import Path
          import os, shutil, hashlib, json
          d = Path(os.environ["MODEL_DIR"])
          qrev = "3b02c98fa0b19e9daab247d633095b6e8a6cd4c5"
          trev = "d3a78581751d518bbfa9e871a6d84059554d53c5"
          snapshot_download(
              repo_id="Mapika/decider-4b-GGUF", revision=trev,
              local_dir=str(d),
              allow_patterns=[
                  "config.json","decider_config.json","tokenizer.json",
                  "tokenizer_config.json","special_tokens_map.json",
                  "*.jinja","vocab.json","merges.txt","added_tokens.json",
              ],
          )
          names = [x.rfilename for x in HfApi().model_info(
              "mradermacher/decider-4b-GGUF",revision=qrev).siblings]
          qs = [n for n in names if n.lower().endswith("q4_k_m.gguf")
                and "/" not in n]
          if len(qs) != 1:
              raise RuntimeError(f"Expected exactly one pinned Q4_K_M: {qs}")
          src = hf_hub_download(
              repo_id="mradermacher/decider-4b-GGUF",
              filename=qs[0], revision=qrev)
          out = d / qs[0]
          if not out.exists():
              shutil.copyfile(src, out)
          expected = d / "decider-4b.Q4_K_M.gguf"
          if out != expected:
              if expected.exists():
                  raise RuntimeError("Conflicting native model")
              expected.symlink_to(out.name)
          digest = hashlib.sha256()
          with out.open("rb") as data:
              while chunk := data.read(8*1024*1024):
                  digest.update(chunk)
          manifest = dict(
              model="decider-q4", hf_revision=qrev,
              tokenizer_revision=trev, sha256=digest.hexdigest(),
              size=out.stat().st_size, source_file=out.name,
          )
          (d.parent / "model-manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8")
          print("OX_G16O_REAL_GGUF_PROVISIONED", manifest)
          PY
      - name: Measure cold warm binary service and 6 20 40 simultaneous arrivals
        run: |
          python scenarios/profiling/g16o_binary_capacity.py \
            --engine decider-q4 \
            --gguf-path "$OX_DECIDER_GGUF_PATH" \
            --model-manifest .ox-state/g16o/model-manifest.json \
            --output .ox-state/g16o/binary-capacity.json
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path(".ox-state/g16o/binary-capacity.json").read_text())
          assert x["native_model_verified"] and x["backend"] == "decider-q4"
          assert x["model_provenance"]["sha256"] == "c03deb433d539ef49579fca5a015d5090c739a331448493aded7a57ad9b4261b"
          assert x["actual_native_forward_calls"] > 0
          assert x["synthetic_fixture_forward_calls"] == 0
          assert x["maximum_simultaneous_native_forwards"] == 1
          assert [r["actors"] for r in x["bursts"]] == [6, 20, 40]
          assert all(r["deadline_seconds"] == 25 for r in x["bursts"])
          assert x["world_commands_sent"] == x["world_receipts_claimed"] == 0
          assert not x["production_activation_accepted"]
          print("OX_G16O_GENUINE_BINARY_HOST_MEASUREMENT_RECORDED", x["capacity_observation"])
          PY
      - name: Retain exact host and model provenance with uncensored measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-g16o-binary-host-${{ matrix.runner-sample }}
          path: |
            .ox-state/g16o/binary-capacity.json
            .ox-state/g16o/model-manifest.json
          retention-days: 21
          if-no-files-found: ignore
