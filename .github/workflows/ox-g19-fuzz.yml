name: Ox G19 targeted fuzzing

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/continuous_ship_physics.py"
      - "game/world/full_ship_operations.py"
      - "game/world/ship_gas_refill.py"
      - "game/world/ship_crew_physiology.py"
      - "game/world/ship_eva_operations.py"
      - "game/world/ship_*.py"
      - "game/world/tests/test_g19_refill_fuzz.py"
      - "game/world/tests/test_installed_ship_g19_fuzz.py"
      - "game/world/tests/test_ship_heat_capacity_consistency.py"
      - ".github/workflows/ox-g19-fuzz.yml"
  push:
    branches: [main]
    paths:
      - "game/world/**"
      - ".github/workflows/ox-g19-fuzz.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      scale:
        description: "Trial multiplier (OX_FUZZ_SCALE)"
        default: "1"

permissions:
  contents: read

concurrency:
  group: ox-g19-fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OX_FUZZ_SCALE: ${{ github.event.inputs.scale || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refill ledger, metering and route fuzzing; heat-capacity consistency
        working-directory: game
        run: |
          python -m unittest world.tests.test_g19_refill_fuzz world.tests.test_ship_heat_capacity_consistency world.tests.test_ship_motion_integrity world.tests.test_ship_persistence_integrity -v

  installed:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OX_FUZZ_SCALE: ${{ github.event.inputs.scale || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Provision the as-fitted Evennia ship
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Tick-chunking differential and crew-action sequence fuzzing
        working-directory: game
        run: |
          python -m world.test_runner \
            world.tests.test_installed_ship_g19_fuzz.TickChunkingDifferentialFuzz \
            world.tests.test_installed_ship_g19_fuzz.CrewActionSequenceFuzz \
            --verbosity=2
