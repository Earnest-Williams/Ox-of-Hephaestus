name: Ox G2 learned-capability GOAP navigation

on:
  pull_request:
    paths:
      - "game/**"
      - "services/ai-handler/**"
      - ".github/workflows/ox-g2-navigation.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "services/ai-handler/**"
      - ".github/workflows/ox-g2-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./services/ai-handler
      - run: |
          python -m compileall -q services/ai-handler/src services/ai-handler/tests
          python -m unittest discover -s services/ai-handler/tests -p 'test_navigation.py' -v

  authenticated-ship-travel:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        scenario: [direct, blocked, reroute]
    env:
      OX_NAVIGATION_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real Evennia, Concordia and authenticated character transport
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler[concordia,transport]'
          python -m compileall -q game services/ai-handler/src
      - name: Generate disposable nonprivileged crew credentials
        shell: bash
        run: |
          TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          OWNER="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$OWNER"
          echo "OX_PROBE_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_PASSWORD=$OWNER" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_USERNAME=OxTrialOwner" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_EMAIL=owner@example.invalid" >> "$GITHUB_ENV"
      - name: Prepare route and ordinary authenticated account in world
        working-directory: game
        run: |
          evennia migrate --noinput
          evennia shell --command="import os; from world.navigation_probe import prepare; ids=prepare(os.environ['OX_NAVIGATION_SCENARIO']); print('OX_G2_NAV_SETUP', ids['ari'])"
      - name: Boot actual Evennia service
        shell: bash
        run: |
          set -euo pipefail
          (cd game && evennia start)
          python - <<'PY'
          import socket,time
          for _ in range(90):
              try:
                  with socket.create_connection(("127.0.0.1",4002),timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("Ordinary crew socket unavailable")
          PY
          sleep 4
      - name: Independently discover exits and traverse by world commands
        shell: bash
        run: |
          python -m ox_ai.runtime.navigation_trial "$OX_NAVIGATION_SCENARIO"
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads(Path(".ox-state/g2c-navigation-result.json").read_text())
          mode=os.environ["OX_NAVIGATION_SCENARIO"]
          expected="blocked" if mode=="blocked" else "arrived"
          assert result["status"]==expected, result
          assert result["inference_calls"]==0, result
          assert result["world_actions_submitted"]==0, result
          if mode=="direct":
              assert result["traversed_exits"]==["out","engineering"], result
          elif mode=="reroute":
              assert "shop" in result["traversed_exits"], result
              assert "engineering" not in result["traversed_exits"], result
          elif mode=="blocked":
              assert result["final_room_name"]!="Engineering", result
          private=json.loads(Path(".ox-state/g2c-ari-navigation.json").read_text())
          assert private["actor_dbref"]==result["actor_dbref"]
          assert len(private["rooms"])>=2, private
          print("OX_G2_AUTHENTICATED_WORLD_PATH_PASS",mode)
          PY
      - name: Shut down world before independent persisted-state verdict
        if: always()
        working-directory: game
        run: evennia stop || true
      - name: Independently verify location and unchanged equipment
        working-directory: game
        run: |
          evennia shell --command="import os; from world.bootstrap import build_ship; s=build_ship(); mode=os.environ['OX_NAVIGATION_SCENARIO']; print('OX_G2_ARI_LOCATION',s['watch'].location.key); assert (s['watch'].location!=s['engineering']) if mode=='blocked' else (s['watch'].location==s['engineering']); assert s['pump'].state=='normal' and not s['pump'].db.event_history; assert s['cradle'].state=='secured' and s['scrubber'].state=='nominal'; print('OX_G2_WORLD_TRAVERSAL_NO_REMOTE_WORK_PASS')"

  displaced-specialist-real-world:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real Evennia, Concordia and crew sockets
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler[concordia,transport]'
      - name: Generate disposable nonprivileged crew credentials
        shell: bash
        run: |
          TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          OWNER="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$OWNER"
          echo "OX_PROBE_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_PASSWORD=$OWNER" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_USERNAME=OxTrialOwner" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_EMAIL=owner@example.invalid" >> "$GITHUB_ENV"
      - name: Place actual environmental specialist in mess before alarm
        working-directory: game
        run: |
          evennia migrate --noinput
          evennia shell --command="from world.transport_probe import provision; provision(include_specialists=True); from world.live_crew import fixture_setup; fixture_setup(scheduled_clock=True); from world.bootstrap import build_ship; s=build_ship(); assert s['scrubber'].inject_fault()[0]; assert s['environment'].move_to(s['mess'],quiet=True); print('OX_G2_TECH_AWAY_FROM_FAILED_SCRUBBER')"
      - name: Boot real ship server
        shell: bash
        run: |
          (cd game && evennia start)
          python - <<'PY'
          import socket,time
          for _ in range(90):
              try:
                  with socket.create_connection(("127.0.0.1",4002),timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("World portal did not start")
          PY
          sleep 4
      - name: Let Teo navigate normal exits and complete authoritative repairs
        run: |
          python -m ox_ai.runtime.five_crew_service finish-teo
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path(".ox-state/p4e-supervisor.json").read_text())
          assert [x["role"] for x in state["specialist_completed"]]==["teo"],state
          assert state["specialist_jobs"]["teo"] is None,state
          nav=state["navigation_knowledge"]["teo"]
          assert nav["actor_dbref"]==json.loads(Path(".ox-state/p4e-ids.json").read_text())["teo"]
          assert any(x["name"]=="Crew Mess" for x in nav["rooms"].values()),nav
          assert any(x["name"]=="Environmental Plant" for x in nav["rooms"].values()),nav
          print("OX_G2_SPECIALIST_REACHED_STATION_WITH_WORLD_EXITS")
          PY
      - name: Stop server before independent equipment inspection
        if: always()
        working-directory: game
        run: evennia stop || true
      - name: Verify actual world position, finite cartridge count and receipts
        working-directory: game
        run: |
          evennia shell --command="from world.bootstrap import build_ship; from world.models import WorkReceipt; s=build_ship(); a=s['scrubber']; assert s['environment'].location==s['environmental']; assert a.state=='nominal' and a.db.spare_cartridges==1; assert [e['operation'] for e in a.db.event_history]==['saturate','isolate','replace','restart']; assert WorkReceipt.objects.filter(target='scrubber').count()==3; assert s['pump'].state=='normal' and s['cradle'].state=='secured'; print('OX_G2_SPECIALIST_NAVIGATION_PHYSICAL_RECEIPTS_PASS')"
