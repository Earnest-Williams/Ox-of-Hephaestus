# Diagnostic only: exact Q2_K and Q4_K_M GGUF revisions, one runner.
name: Ox Decider quantisation speed audit
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen3.5-0.8b-ci]
    paths:
      - ".github/workflows/ox-decider-quant-audit.yml"
permissions:
  contents: read
concurrency:
  group: ox-decider-quant-audit
  cancel-in-progress: true
jobs:
  same-runner-abba:
    name: Same runner Q2 Q4 Q4 Q2
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_QUANT_COMMIT: "3b02c98fa0b19e9daab247d633095b6e8a6cd4c5"
      HF_TOKENIZER_COMMIT: "d3a78581751d518bbfa9e871a6d84059554d53c5"
      MODEL_DIR: ".ox-state/same-runner/model"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Record CPU runner properties
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ox-state/same-runner
          lscpu | tee .ox-state/same-runner/cpu.txt
          free -h | tee .ox-state/same-runner/memory.txt
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
      - name: Install the same pinned native Concordia and GGUF scoring stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e './services/ai-handler[concordia]'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=5,<6' 'numpy<3' 'huggingface_hub>=0.34,<2' jinja2 'llama-cpp-python>=0.3.35,<0.4'
          python -m pip install --no-deps 'decider-ai==1.10.0'
      - name: Verify native scored-choice and evidence fixtures offline
        run: |
          python -m unittest discover -s services/ai-handler/tests -p test_decider_gguf_quant_trial.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_counterfactual_decision_trial.py -v
      - name: Download and verify original Q2 GGUF
        run: |
          python -m scenarios.prepare_decider_gguf \
            --quant Q2_K --quant-revision "$HF_QUANT_COMMIT" \
            --tokenizer-revision "$HF_TOKENIZER_COMMIT" \
            --model-dir "$MODEL_DIR" \
            --manifest .ox-state/same-runner/checkpoint-q2.json
      - name: Download and verify original Q4 GGUF
        run: |
          python -m scenarios.prepare_decider_gguf \
            --quant Q4_K_M --quant-revision "$HF_QUANT_COMMIT" \
            --tokenizer-revision "$HF_TOKENIZER_COMMIT" \
            --model-dir "$MODEL_DIR" \
            --manifest .ox-state/same-runner/checkpoint-q4.json
      - name: Evaluate native model scoring in serial ABBA order on same CPU
        run: |
          python -m scenarios.decider_quant_controlled_audit \
            --model-dir "$MODEL_DIR" \
            --q2-manifest .ox-state/same-runner/checkpoint-q2.json \
            --q4-manifest .ox-state/same-runner/checkpoint-q4.json \
            --output .ox-state/same-runner/audit.json
      - name: Archive audit and CPU hardware details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-decider-quant-same-runner-audit
          path: |
            .ox-state/same-runner/audit.json
            .ox-state/same-runner/checkpoint-q2.json
            .ox-state/same-runner/checkpoint-q4.json
            .ox-state/same-runner/cpu.txt
            .ox-state/same-runner/memory.txt
          retention-days: 7
          if-no-files-found: ignore
