name: Ox G19 lead-mind power-island contracts

on:
  push:
    branches: [g19/lead-mind-power-islands]
    paths:
      - "design/ship/lead_mind_power_islands.json"
      - "design/ship/ox_full_ship.json"
      - "design/ship/ox_full_ship_v0.5_candidate.json"
      - "game/world/ship_model.py"
      - "game/world/ship_world.py"
      - "game/world/full_ship_operations.py"
      - "game/world/ship_electrical_power.py"
      - "game/world/ship_auxiliary_electrical.py"
      - "game/world/ship_equipment_services.py"
      - "game/world/ship_persistence_integrity.py"
      - "game/world/ship_cabin_fancoils.py"
      - "game/world/models.py"
      - "game/world/bootstrap.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_electrical_power.py"
      - "game/world/tests/test_ship_auxiliary_electrical.py"
      - "game/world/tests/test_installed_ship_cabin_fancoils.py"
      - ".github/ci/check_ox_ci_scope.py"
      - "design/ci/check_world_test_selection.py"
      - "design/ship/lead_mind_support_topology.json"
      - "game/world/ship_mind_power.py"
      - "game/world/ship_mind_runtime.py"
      - "game/world/ship_mind_service.py"
      - "game/commands/ship_physics.py"
      - "game/world/ship_mind_support.py"
      - "game/world/ship_mind_support_world.py"
      - "game/world/ship_control_gateway.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_mind_power.py"
      - "game/world/tests/test_ship_mind_runtime.py"
      - "game/world/tests/test_ship_mind_service.py"
      - "game/world/tests/test_ship_mind_support.py"
      - "game/world/tests/test_ship_control_gateway.py"
      - "game/world/tests/test_installed_ship_mind_power.py"
      - ".github/workflows/ox-lead-mind-power.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "design/ship/lead_mind_power_islands.json"
      - "design/ship/ox_full_ship.json"
      - "design/ship/ox_full_ship_v0.5_candidate.json"
      - "game/world/ship_model.py"
      - "game/world/ship_world.py"
      - "game/world/full_ship_operations.py"
      - "game/world/ship_electrical_power.py"
      - "game/world/ship_auxiliary_electrical.py"
      - "game/world/ship_equipment_services.py"
      - "game/world/ship_persistence_integrity.py"
      - "game/world/ship_cabin_fancoils.py"
      - "game/world/models.py"
      - "game/world/bootstrap.py"
      - "game/world/ship_crew_access.py"
      - "game/world/tests/test_ship_electrical_power.py"
      - "game/world/tests/test_ship_auxiliary_electrical.py"
      - "game/world/tests/test_installed_ship_cabin_fancoils.py"
      - ".github/ci/check_ox_ci_scope.py"
      - "design/ci/check_world_test_selection.py"
      - "design/ship/lead_mind_support_topology.json"
      - "game/world/ship_mind_power.py"
      - "game/world/ship_mind_runtime.py"
      - "game/world/ship_mind_service.py"
      - "game/commands/ship_physics.py"
      - "game/world/ship_mind_support.py"
      - "game/world/ship_mind_support_world.py"
      - "game/world/ship_control_gateway.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_mind_power.py"
      - "game/world/tests/test_ship_mind_runtime.py"
      - "game/world/tests/test_ship_mind_service.py"
      - "game/world/tests/test_ship_mind_support.py"
      - "game/world/tests/test_ship_control_gateway.py"
      - "game/world/tests/test_installed_ship_mind_power.py"
      - ".github/workflows/ox-lead-mind-power.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-mind-power-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    # Draft infrastructure changes need acceptance evidence before review.
    name: Pure fault-domain and finite reserve contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile power-island and inherited G19 electrical code
        run: |
          python -m compileall -q game/world/ship_mind_power.py game/world/ship_mind_runtime.py game/world/ship_mind_service.py game/world/tests/test_ship_mind_service.py game/world/ship_mind_support.py game/world/ship_mind_support_world.py game/world/ship_electrical_power.py game/world/ship_control_gateway.py game/world/tests/test_ship_control_gateway.py game/world/continuous_ship_physics.py game/world/tests/test_installed_ship_mind_power.py game/world/tests/test_ship_mind_power.py game/world/tests/test_ship_mind_runtime.py game/world/tests/test_ship_mind_support.py
      - name: Validate scoped CI workflow conventions
        run: python .github/ci/check_ox_ci_scope.py
      - name: Exercise all candidate fault domains and measured reserves
        working-directory: game
        run: python -m unittest world.tests.test_ship_mind_power world.tests.test_ship_mind_runtime world.tests.test_ship_mind_service world.tests.test_ship_mind_support world.tests.test_ship_electrical_power world.tests.test_ship_auxiliary_electrical world.tests.test_ship_control_gateway -v
      - name: Preserve unmodified published and G19 candidate topology
        run: python design/ship/check_v05_candidate.py

  installed:
    needs: candidate
    name: Installed ship — ${{ matrix.slice }}
    strategy:
      fail-fast: false
      matrix:
        slice: [power-network-cooling, read-only-gateway, review-regressions, thermal-recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVENNIA_SUPERUSER_USERNAME: OxCI
      EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
      OX_PG_DATABASE: ox_mind_power_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install game with owned world models and PostgreSQL
        run: python -m pip install .
      - name: Run actual ship installation and casualty regressions
        if: matrix.slice == 'power-network-cooling'
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_mind_power world.tests.test_installed_ship_cabin_fancoils.InstalledCabinFanCoils.test_live_original_power_and_lt_valves_create_positive_cabin_output --exclude-tag=g19_gateway --exclude-tag=g19_infrastructure_review --exclude-tag=g19_mind_recovery --verbosity=2
      - name: Run independent gateway power, protocol and thermal acceptance
        if: matrix.slice == 'read-only-gateway'
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_mind_power --tag=g19_gateway --verbosity=2
      - name: Run commissioning and conservation review regressions
        if: matrix.slice == 'review-regressions'
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_mind_power --tag=g19_infrastructure_review --verbosity=2
      - name: Run attended thermal recovery and restart acceptance
        if: matrix.slice == 'thermal-recovery'
        working-directory: game
        run: python -m world.test_runner world.tests.test_installed_ship_mind_power --tag=g19_mind_recovery --verbosity=2
