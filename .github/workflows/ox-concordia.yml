# Real Concordia contract exercise; separate from fast stdlib scaffold checks.
name: Ox Concordia entity integration

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "services/ai-handler/**"
      - ".github/workflows/ox-concordia.yml"
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - "services/ai-handler/**"
      - ".github/workflows/ox-concordia.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  entity-lifecycle:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Native Concordia entity lifecycle (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install pinned Concordia optional extra
        run: python -m pip install -e './services/ai-handler[concordia]'
      - name: Exercise actual Concordia components
        run: |
          python -c "from concordia.agents.entity_agent_with_logging import EntityAgentWithLogging; print('Concordia API available:', EntityAgentWithLogging)"
          python -m unittest discover -s services/ai-handler/tests -p 'test_concordia_*.py' -v
          python -m unittest discover -s services/ai-handler/tests -p 'test_character_factory.py' -v
          python -m unittest discover -s services/ai-handler/tests -p 'test_profile_decision_trials.py' -v
          python -m ox_ai.agents.decision_trials > /tmp/ox-personality-trials.json
          python -c "import json; d=json.load(open('/tmp/ox-personality-trials.json')); assert d['world_actions_submitted']==0 and d['total_inference_calls']==12 and d['profiles']['methodical']==d['profiles']['collaborative']; print('OX_PROFILE_PROBE_PASS')"
          python services/ai-handler/examples/one_engineer.py
