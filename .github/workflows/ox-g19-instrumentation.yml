name: Ox G19 installed instrumentation and fault-recovery acceptance

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_instrumentation.py"
      - "game/world/ship_fault_recovery.py"
      - "game/world/ship_process_outputs.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/ship_workshop_dynamics.py"
      - "game/world/ship_instrumentation_world.py"
      - "game/world/tests/test_ship_instrumentation.py"
      - "game/world/tests/test_ship_fault_recovery.py"
      - "game/world/tests/test_ship_process_outputs.py"
      - "game/world/tests/test_ship_workshop_dynamics.py"
      - "game/world/tests/test_installed_ship_instrumentation.py"
      - "game/world/tests/test_installed_ship_waste_repair.py"
      - "game/world/continuous_ship_physics.py"
      - "game/commands/ship_physics.py"
      - ".github/workflows/ox-g19-instrumentation.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "game/world/ship_instrumentation.py"
      - "game/world/ship_fault_recovery.py"
      - "game/world/ship_process_outputs.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/ship_workshop_dynamics.py"
      - "game/world/ship_instrumentation_world.py"
      - "game/world/tests/test_ship_instrumentation.py"
      - "game/world/tests/test_ship_fault_recovery.py"
      - "game/world/tests/test_ship_process_outputs.py"
      - "game/world/tests/test_ship_workshop_dynamics.py"
      - "game/world/tests/test_installed_ship_instrumentation.py"
      - "game/world/tests/test_installed_ship_waste_repair.py"
      - "game/world/continuous_ship_physics.py"
      - "game/commands/ship_physics.py"
      - ".github/workflows/ox-g19-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-g19-instruments-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Pure sensor provenance, latching, blackouts and old subsystems
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile installed sensor and physical world integration
        run: |
          python -m compileall -q game/world/ship_process_outputs.py game/world/ship_water_recycling.py game/world/tests/test_ship_process_outputs.py game/world/ship_workshop_dynamics.py game/world/tests/test_ship_workshop_dynamics.py game/world/ship_fault_recovery.py game/world/ship_instrumentation.py game/world/ship_instrumentation_world.py game/world/continuous_ship_physics.py game/world/tests/test_ship_instrumentation.py game/world/tests/test_installed_ship_instrumentation.py game/commands/ship_physics.py
      - name: Run origin, tamper, blackout, alarm and existing machinery pure tests
        working-directory: game
        run: |
          python -m unittest world.tests.test_ship_process_outputs world.tests.test_ship_workshop_dynamics world.tests.test_ship_fault_recovery world.tests.test_ship_instrumentation world.tests.test_ship_electrical_power world.tests.test_ship_equipment_services world.tests.test_ship_equipment_wear world.tests.test_ship_water_recycling world.tests.test_ship_food_logistics world.tests.test_ship_food_cultivation -v

