# G6 real Evennia world experiment. Deliberately targeted, never upstream
# compatibility matrix. Hosted Gemini is opt-in through branch-local PRs or
# manual dispatch using the existing GitHub secret.
name: Ox G6 six-authenticated terminal-voyage experiment

on:
  pull_request:
    paths:
      - "game/world/terminal_failure.py"
      - "game/server/conf/at_server_startstop.py"
      - "game/world/work_actions.py"
      - "game/world/tests/test_terminal_failure.py"
      - "game/commands/terminal.py"
      - "game/commands/default_cmdsets.py"
      - "game/typeclasses/ship.py"
      - "services/ai-handler/src/ox_ai/ports/evennia/durable.py"
      - "scenarios/terminal_live/**"
      - ".github/workflows/ox-g6-terminal-live.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  world-tests:
    name: G6 authoritative world and death tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Evennia
        run: python -m pip install .
      - name: Run new world module tests only
        working-directory: game
        run: python -m world.test_runner world.tests.test_terminal_failure --verbosity=2

  six-characters:
    name: "${{ matrix.provider }} seed ${{ matrix.seed }} (six actual clients)"
    needs: world-tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        # Gate six paid/model trials on one real-server GOAP integration.
        provider: [goap]
        seed: [241]
    env:
      OX_TERMINAL_LIVE_CI: "1"
      OX_CAPTAIN_OVERSIGHT: "1"
      OX_COGNITION_PROVIDER: ${{ matrix.provider == 'gemini' && 'gemini' || 'mock' }}
      OX_LLM_MODEL: gemini-3.1-flash-lite
      OX_MAX_PARALLEL_COGNITION: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Evennia, pinned Concordia, and transport
        run: |
          python -m pip install .
          python -m pip install -e './services/ai-handler[concordia,transport]'
      - name: Regression check captain's completed command is remembered
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scenarios/terminal_live")
          from trial import LocalGoap, choices
          ctrl = LocalGoap("captain")
          ctrl.notice("terminal_survey", "succeeded")
          view = {"oxygen_kpa": 16.0, "co2_percent": 1.1, "own_finding": ""}
          first = ctrl.choose(view, [], choices("captain"))[0]
          assert first.verb == "terminal_command"
          ctrl.notice("terminal_command", "succeeded")
          following = ctrl.choose(view, [], choices("captain"))[0]
          assert following.verb != "terminal_command"
          assert {"commanded", "primary_attempted"} <= ctrl.beliefs
          print("OX_G6_CAPTAIN_GOAP_NO_DUPLICATE_COMMAND_PASS")
          PY
      - name: Create disposable credentials and model opt-in
        shell: bash
        env:
          MODEL_KEY: ${{ matrix.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          NEED_MODEL: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          OWNER="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$OWNER"
          echo "OX_PROBE_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_PASSWORD=$OWNER" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_USERNAME=OxTerminalCI" >> "$GITHUB_ENV"
          echo "EVENNIA_SUPERUSER_EMAIL=terminal@example.invalid" >> "$GITHUB_ENV"
          if [ "$NEED_MODEL" = gemini ]; then
            if [ -z "$MODEL_KEY" ]; then
              echo "::error::Missing GEMINI_API_KEY for explicitly selected Gemini trial"
              exit 1
            fi
            echo "::add-mask::$MODEL_KEY"
            echo "GEMINI_API_KEY=$MODEL_KEY" >> "$GITHUB_ENV"
          fi
      - name: Arm authoritative incident and six real character accounts
        working-directory: game
        env:
          TRIAL_SEED: ${{ matrix.seed }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../.ox-state
          evennia migrate --noinput
          evennia shell --command="from world.transport_probe import provision; from world.terminal_failure import arm_terminal; assert len(provision(include_specialists=True,include_captain=True))==6; arm_terminal(seed=int('$TRIAL_SEED')); print('OX_G6_SIX_AUTHORISED_BODIES_ARMED')" | tee ../.ox-state/arm.log
          grep -Fq "OX_G6_SIX_AUTHORISED_BODIES_ARMED" ../.ox-state/arm.log
      - name: Start actual Evennia portal and server clock
        shell: bash
        run: |
          set -euo pipefail
          (cd game && evennia start)
          python - <<'PY'
          import socket, time
          for _ in range(90):
              try:
                  with socket.create_connection(("127.0.0.1", 4002), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("Actual Evennia WebSocket portal unavailable")
          PY
          sleep 4
      - name: Run six simultaneous actor-scoped clients
        shell: bash
        env:
          TRIAL_SEED: ${{ matrix.seed }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          python scenarios/terminal_live/trial.py --provider "$PROVIDER" --seed "$TRIAL_SEED" --out .ox-state/g6-handler.json | tee .ox-state/trial.log
          grep -Fq "OX_G6_SIX_AUTHENTICATED_TERMINAL_RUN_PASS" .ox-state/trial.log
      - name: Stop actual world server before operator audit
        if: always()
        working-directory: game
        shell: bash
        run: evennia stop || true
      - name: Capture world state even when a client trial fails
        if: always()
        working-directory: game
        shell: bash
        run: |
          evennia shell --command="from world.terminal_failure import audit_terminal; a=audit_terminal('../.ox-state/g6-world.json'); print('OX_G6_AUDIT_SNAPSHOT fatal=', a['fatal'], 'world_minute=', a['world_minute'], 'receipts=', len(a['receipted_attempts']))" > ../.ox-state/world-audit.log 2>&1 || true
          grep 'OX_G6_AUDIT_SNAPSHOT' ../.ox-state/world-audit.log || true
      - name: Verify actual world deaths and private receipts
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          python ../scenarios/terminal_live/report.py --world ../.ox-state/g6-world.json --crew ../.ox-state/g6-handler.json --output ../.ox-state/g6-report.md
      - name: Preserve six-character and operator-separated findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-${{ matrix.provider }}-${{ matrix.seed }}
          path: |
            .ox-state/g6-handler.json
            .ox-state/g6-partial.json
            .ox-state/g6-world.json
            .ox-state/g6-report.md
            .ox-state/trial.log
            .ox-state/arm.log
            .ox-state/world-audit.log
          retention-days: 14
          if-no-files-found: ignore
