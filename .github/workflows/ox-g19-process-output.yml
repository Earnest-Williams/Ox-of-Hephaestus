name: Ox G19 attributed air water fire and bearing process output
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_process_outputs.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_process_outputs.py"
      - "game/world/tests/test_installed_ship_electrical.py"
      - ".github/workflows/ox-g19-process-output.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ox-g19-process-output-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    name: 42 actual fitted motors and finite media source proofs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile process and installed ship sources
        run: |
          python -m compileall -q game/world/ship_process_outputs.py game/world/ship_water_recycling.py game/world/continuous_ship_physics.py game/world/tests/test_ship_process_outputs.py game/world/tests/test_installed_ship_electrical.py
      - name: Pure output provenance, A/B water conservation, fire ambiguity and oil pressure
        working-directory: game
        run: |
          python -m unittest world.tests.test_ship_process_outputs world.tests.test_ship_water_recycling world.tests.test_ship_auxiliary_electrical -v
