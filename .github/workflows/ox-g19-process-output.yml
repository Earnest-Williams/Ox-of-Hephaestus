name: Ox G19 attributed air water fire and bearing process output
on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_process_outputs.py"
      - "game/world/ship_water_recycling.py"
      - "game/world/continuous_ship_physics.py"
      - "game/world/tests/test_ship_process_outputs.py"
      - "game/world/tests/test_installed_ship_electrical.py"
      - ".github/workflows/ox-g19-process-output.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ox-g19-process-output-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    name: 42 actual fitted motors and finite media source proofs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile process and installed ship sources
        run: |
          python -m compileall -q game/world/ship_process_outputs.py game/world/ship_water_recycling.py game/world/continuous_ship_physics.py game/world/tests/test_ship_process_outputs.py game/world/tests/test_installed_ship_electrical.py
      - name: Pure output provenance, A/B water conservation, fire ambiguity and oil pressure
        working-directory: game
        run: |
          python -m unittest world.tests.test_ship_process_outputs world.tests.test_ship_water_recycling world.tests.test_ship_auxiliary_electrical -v
  installed:
    name: Real per-machine CO2, A/B wastewater, bearing oil and fire water
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install actual ship and Evennia runtime
        run: python -m pip install .
      - name: Initialize disposable authoritative ship database
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Real isolated source, finite outputs and failure transitions
        working-directory: game
        run: |
          python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_live_eclss_capture_has_current_mass_receipt_not_just_power world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_bearing_lube_own_flow_pressure_and_actual_fuse_loss world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_individual_a_b_wet_processors_require_real_processed_mass world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_normal_fire_pump_actual_mist_stops_on_local_motor_fuse world.tests.test_installed_ship_electrical.InstalledElectricalTests.test_one_hab_air_handler_trip_stops_forced_flow_without_isolating_ducts --verbosity=2
