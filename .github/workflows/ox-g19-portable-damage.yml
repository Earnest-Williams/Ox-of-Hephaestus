name: Ox G19 fitted portable pumps and smoke-control fans

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_portable_damage.py"
      - "game/world/tests/test_ship_portable_damage.py"
      - "game/world/tests/test_installed_ship_portable_damage.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-portable-damage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ten fitted portable emergency devices and existing ship clock
        run: |
          python -m compileall -q game/world/ship_portable_damage.py game/world/continuous_ship_physics.py game/world/tests/test_ship_portable_damage.py game/world/tests/test_installed_ship_portable_damage.py
      - name: "Four pumps and six fans - bounded liquid and smoke conservation"
        working-directory: game
        run: python -m unittest world.tests.test_ship_portable_damage -v

  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Install original water wet-crossing and pressure-cell records
        working-directory: game
        env:
          EVENNIA_SUPERUSER_USERNAME: OxCI
          EVENNIA_SUPERUSER_EMAIL: oxci@example.invalid
        run: |
          export EVENNIA_SUPERUSER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          evennia migrate --noinput
      - name: Installed finite local pump, smoke fan and crew custody acceptance
        working-directory: game
        run: python -m world.test_runner --prebuilt-ship world.tests.test_installed_ship_portable_damage --verbosity=2

