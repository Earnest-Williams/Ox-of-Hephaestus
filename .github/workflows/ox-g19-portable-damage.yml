name: Ox G19 fitted portable pumps and smoke-control fans

on:
  push:
    branches: [g19-complete-ship-systems]
    paths:
      - "game/world/ship_portable_damage.py"
      - "game/world/tests/test_ship_portable_damage.py"
      - "game/world/tests/test_installed_ship_portable_damage.py"
      - "game/world/continuous_ship_physics.py"
      - ".github/workflows/ox-g19-portable-damage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ten fitted portable emergency devices and existing ship clock
        run: |
          python -m compileall -q game/world/ship_portable_damage.py game/world/continuous_ship_physics.py game/world/tests/test_ship_portable_damage.py game/world/tests/test_installed_ship_portable_damage.py
      - name: "Four pumps and six fans - bounded liquid and smoke conservation"
        working-directory: game
        run: python -m unittest world.tests.test_ship_portable_damage -v

