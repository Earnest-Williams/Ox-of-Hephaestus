name: Ox fast PR gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ox-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast source, scope and transport checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/transport.txt
      - name: Compile Ox Python sources
        run: python -m compileall -q game services/ai-handler/src services/ai-handler/tests scenarios .github/ci
      - name: Validate CI scope and two-tier invariants
        run: python .github/ci/check_ox_ci_scope.py
      - name: Install minimal handler transport
        run: python -m pip install -e './services/ai-handler[transport]'
      - name: Run fast WebSocket and inbox unit regressions
        run: |
          python -m unittest discover -s services/ai-handler/tests -p test_evennia_client.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_paged_inbox.py -v
          python -m unittest discover -s services/ai-handler/tests -p test_durable_port.py -v
