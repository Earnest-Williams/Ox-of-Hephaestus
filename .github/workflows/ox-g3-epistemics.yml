name: Ox G3 actor epistemics open-world invariants

on:
  pull_request:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "services/ai-handler/**"
      - ".github/workflows/ox-g3-epistemics.yml"
      - "!**/*.md"
  push:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    branches: [main]
    paths:
      - "services/ai-handler/**"
      - ".github/workflows/ox-g3-epistemics.yml"
      - "!**/*.md"
  workflow_dispatch:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  private-knowledge-ledger:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/ai-handler/pyproject.toml
            uv.lock
            .github/ci/cache-profiles/concordia.txt
      - name: Install handler without hosted inference credentials
        run: python -m pip install -e ./services/ai-handler
      - name: Check no closed-world or unverifiable fact promotion
        run: |
          python -m compileall -q services/ai-handler/src services/ai-handler/tests
          python -m unittest discover -s services/ai-handler/tests -p 'test_epistemics.py' -v
