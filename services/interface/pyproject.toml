[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ox-interface"
version = "0.0.0"
description = "Preparatory package for the Ox human operations and AI inspection interface"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["ox_interface*"]
